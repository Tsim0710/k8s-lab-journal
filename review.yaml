# План повторения конспектов — источник правды для страницы review.html.
# Подробно, с объяснением порядка, — k8s-lab-infra/docs/interview/review-plan.md (приватное репо).
#
# status: todo | now | done. Тема «now» — ровно одна.
# done — дата первого прохода. repeats — сделанные повторы: {date, clean}.
# Следующий повтор считается сам: после первого прохода +7 дней, после чистого повтора +21,
# после повтора с провалами +7. weak — что провисло, коротко и по делу.

start: '2026-11-09'
drill_url: https://tsim0710.github.io/devops-anki/

daily: >-
  Тренажёр 10–15 минут: домен k8s, уровни middle и senior, подтемы уже пройденных тем вперемешку.

method:
  - Вспомнить без подсказок — вопросы из «📌» модулей (у сетей — «Грабли»), ответ вслух
  - «🎯 Ситуации» — сначала свой ответ вслух, потом сверка
  - Тело модуля — только там, где споткнулся
  - Конспект лаба по теме и «Вопросы на собесе» в конце файла — вслух
  - Тренажёр — подтемы темы, middle и senior
  - Записать, что провисло

before_interview:
  - Kubernetes, «Памятка-оси» — целиком
  - Сети, справочник — часть 1 бегло, часть 2 вслух, «Философия» и «Мои личные грабли»
  - interview/rbac.md и «Вопросы на собесе» по темам вакансии
  - Журнал за 08.11 — карточка защиты блока 1 и строки для резюме
  - interview/resume-map.md — по каждой строке вспомнить шаг маршрута

