          `kubectl get netpol -A` и какие политики выбирают под по меткам. В Cilium отброшенные пакеты видны
          напрямую: `cilium-dbg monitor --type drop` или Hubble, где у каждого дропа написана причина. Без
          этого остаётся проверять curl'ом из подов по одному.
