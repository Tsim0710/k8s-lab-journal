  - id: 9
    title: 'Логи: Fluent Bit, Loki, алерты по логам'
    area: Наблюдаемость
    status: todo
    brief: >-
      Fluent Bit на каждой ноде читает файлы логов подов, как `tail -f`, помнит, докуда дочитал, и
      приклеивает к строке «адрес»: неймспейс, приложение, контейнер, нода. Loki индексирует только этот
      адрес — метки, а сам текст хранит сжатыми кусками и при поиске читает их подряд. Поэтому меток мало:
      каждая новая комбинация — отдельный поток. Алерты по логам считает ruler Loki и шлёт в тот же
      Alertmanager. Главный урок: пайплайн логов ломается молча, поэтому за сборщиком, Loki и ruler
      смотрит Prometheus.
    steps: [2-8, 2-9]
    read:
      - title: Loki overview
        url: https://github.com/grafana/loki/blob/main/docs/sources/get-started/overview.md
        note: >-
          Индекс только по меткам, текст — сжатыми кусками, отсюда правило «меток мало». Это страница
          документации в репо Loki: grafana.com из РБ без VPN отдаёт 451.
        lang: en
        min: 9
      - title: Fluent Bit — Key concepts
        url: https://docs.fluentbit.io/manual/concepts/key-concepts
        note: >-
          Событие, тег, запись и маршрутизация по тегам — из чего собран пайплайн Fluent Bit.
        lang: en
        min: 5
    questions:
      - q: Почему Loki дешевле Elasticsearch и где подвох?
        a: >-
          Loki индексирует только метки, а текст хранит сжатыми кусками и при поиске читает подряд.
          Подвох — меток должно быть мало: метка с request_id или именем пода плодит потоки и убивает
          установку. У нас метки namespace, app, container и node, а pod лежит в structured metadata.
      - q: Разбирать JSON-логи в сборщике или при запросе?
        a: >-
          Зависит от хранилища. Elasticsearch индексирует поля — там разбирают при записи. Loki
          индексирует только метки, поэтому строка хранится как есть, а `| json` — в запросе. Поля в
          метках — верный способ убить Loki числом потоков.
      - q: Как Fluent Bit не теряет строки, если Loki лежит?
        a: >-
          Позицию чтения каждого файла он хранит на диске ноды, а неотправленное складывает в буфер на
          диске и досылает, когда Loki вернётся. При первом запуске читает с конца файлов, чтобы не слать
          старое. Памяти ему хватает 14–36 МБ на ноду.
      - q: Retention в Loki выставлен, а логи не удаляются. Почему?
        a: >-
          Удаляет compactor, и только с `retention_enabled: true`. Без этого `retention_period` — просто
          цифра в конфиге. У нас так было с первого дня: лежали логи двухнедельной давности.
      - q: Loki отбрасывает строки с `too_far_behind`. Что это?
        a: >-
          Строка старше последней, уже принятой в этом потоке. Часы на ноде когда-то убегали на два года
          вперёд, Loki принял строки «из 2028-го» и потом неделю выбрасывал все нормальные строки этих
          потоков — около 23%. Видно по `loki_discarded_samples_total`, но метрик Loki в Prometheus
          тогда не было.
      - q: Когда алерт по логам, а когда по метрикам?
        a: >-
          По метрикам всё, что можно: дешевле и не ломается от смены формата лога. По логам — когда
          метрики нет или смысл только в тексте: почему не скачивается образ (401 и «тег удалён» лечатся
          по-разному), неудачные входы в ArgoCD и Grafana.
      - q: Что может молча сломаться в алертах по логам?
        a: >-
          Правила не загрузились (не тот путь), запросы падают по таймауту, ruler не достучался до
          Alertmanager — алертов просто нет, и выглядит это как «всё спокойно». Поэтому за ruler смотрит
          Prometheus по его метрикам, а правила проверяются в CI на настоящих строках: одно событие
          часто пишется несколькими строками.
    lab: ['03-observability — «Логи: Loki и Alloy», «Логи: Fluent Bit вместо Alloy», «Алерты по логам: ruler Loki»']
    gdoc: ['Kubernetes: M20']
    seen: [runbooks/logs, runbooks/log-alerts]
    drill: ['k8s: observability', 'linux: logs']

