# План повторения — источник правды для страницы review.html. Как вести — CLAUDE.md, «План повторения».
# Подробно, с источниками и ссылками на Google-конспекты, — k8s-lab-infra/docs/interview/review-plan.md.
#
# Тема: status todo | now | done (now — ровно одна), done — дата первого прохода,
# repeats — повторы {date, clean}, weak — что провисло, коротко.
# Срок повтора считается сам по лестнице ladder: после прохода 7 дней, каждый чистый повтор подряд —
# ступенька выше (21, потом 42), повтор с провалами — снова 7.
# steps — шаги лаба из roadmap.yaml. Каждый закрытый шаг обязан быть хотя бы в одной теме.
# Шаги, закрытые с restart и не попавшие в consolidated, — «свежие»: их закрепляет опрос Claude.
# read — базовые статьи, по одной на инструмент. lab — приватные конспекты k8s-lab-infra/docs,
# gdoc — модули Google-конспектов (только названия, без ссылок), seen — публичные runbook'и и ситуации.
# В текстах работают `код` и **жирный**.

start: '2026-11-09'
restart: '2026-11-22'
ladder: [7, 21, 42]
drill_url: https://tsim0710.github.io/devops-anki/
private_url: https://github.com/jjjopa5/k8s-lab-infra/blob/main/docs/

stages:
  - key: pass
    title: Первый проход темы
    time: 45–60 мин
    when: Сам, по этой странице. Одна тема за сессию, по порядку списка.
    why: >-
      Лаб даёт опыт, но через неделю детали стираются. Проход связывает три вещи: как это устроено
      (статья), что делал сам (шаги лаба) и как об этом спросят (вопросы). Вспоминать полезнее, чем
      перечитывать, поэтому сначала отвечаешь сам и только потом читаешь.
    steps:
      - name: Разогрев
        time: 5 мин
        how: >-
          Прочитай «Простыми словами». Пройди «Проверь себя», не раскрывая ответы: на каждый вопрос —
          своя фраза вслух. Где не смог, запомни: туда и пойдёт внимание.
      - name: Основа
        time: 10–15 мин
        how: >-
          Базовые статьи темы. Читай с вопросом: как это устроено под капотом и как я объясню это за
          минуту. Конспектировать не нужно.
      - name: Свои шаги
        time: 15 мин
        how: >-
          По каждому шагу лаба: запись журнала — что было и что стало. Потом итог шага 🔒: «Решения и
          что отбросили», «Что пошло не так». В конце — «Как рассказать на собесе»: сначала сам вслух,
          потом сверка с текстом.
      - name: Теория по провалам
        time: 10 мин
        how: >-
          Модули Google-конспекта — только там, где споткнулся. «📌» и «🎯 Ситуации»: свой ответ вслух,
          потом сверка. Модуль подряд целиком не перечитывать.
      - name: Проверка
        time: 10 мин
        how: >-
          «Проверь себя» ещё раз, теперь раскрывая ответ после своего. Потом тренажёр: подтемы темы,
          уровни middle и senior.
      - name: Итог
        time: 2 мин
        how: >-
          Напиши Claude: «прошёл тему N, провисло: …». Провисшее встанет первым в повтор, срок повтора
          посчитается сам.

  - key: fresh
    title: Свежий шаг лаба
    time: 5–10 мин
    when: >-
      Опрос Claude в начале следующей лаб-сессии, пока поднимается лаб. Свежие — шаги, закрытые
      с 22.11.
    why: >-
      Закрепить, пока детали свежие: через день рассказ о шаге складывается за минуту, через месяц —
      уже по бумажке.
    steps:
      - name: Что было и что стало
        how: Простыми словами, как объяснил бы коллеге, который не видел лаба.
      - name: Почему так
        how: Какое решение принял, какую альтернативу отбросил и чем она хуже именно здесь.
      - name: Что сломалось
        how: Что пошло не так по ходу, какая была ложная гипотеза и как нашёл причину.
      - name: Рассказ для собеса
        time: 2 мин
        how: Задача → что сделал → где сломалось → как нашёл → результат с цифрой. Без подглядывания.
      - name: Отметка
        how: Claude отмечает шаг закреплённым. Дальше шаг живёт в повторах своей темы.

  - key: repeat
    title: Повтор по сроку
    time: 10–20 мин
    when: >-
      Опрос Claude в начале лаб-сессии или сам по странице, 15–20 минут. Чей срок пришёл — видно
      в «Сегодня».
    why: >-
      Вспоминать через растущие промежутки — самый дешёвый способ помнить долго. Повтор через неделю
      после прохода, после чистого повтора — через три, потом через шесть. Споткнулся — снова через
      неделю.
    steps:
      - name: Провисшее
        how: Начать с «Провисло» — с того, что не далось в прошлый раз.
      - name: Вопросы
        how: «Проверь себя» вслух, без подсказок. Ответ раскрывать только после своего.
      - name: Рассказ по шагам
        how: По каждому шагу темы — «как на собесе», 1–2 минуты.
      - name: Тренажёр
        time: 5 мин
        how: Подтемы темы, middle и senior.
      - name: Итог
        how: >-
          «Чисто» или «провисло: …» — Claude записывает повтор, следующий срок посчитается сам.

  - key: daily
    title: Тренажёр каждый день
    time: 10–15 мин
    when: С телефона — в дороге или между делами.
    why: >-
      Карточки показывают, знаешь ли ты ответ или только узнаёшь его, когда видишь. Перемешанные
      подтемы заставляют вспоминать, а не угадывать по соседним вопросам.
    steps:
      - name: Фильтр
        how: Домен k8s, уровни middle и senior, подтемы уже пройденных тем вперемешку.
      - name: Честно
        how: Не вспомнил за 10 секунд — «не знаю». Такие карты тренажёр сам ставит в начало очереди.
      - name: Junior
        how: Только если сыпется middle.

  - key: interview
    title: Перед собесом
    time: за 1–2 дня
    when: Под конкретную вакансию.
    why: >-
      На собесе спрашивают не факты, а «как бы ты сделал» и «расскажи, как было у тебя». За день до
      него нужны оси для вывода ответа и готовые истории, а не новые знания.
    steps:
      - name: Оси
        how: >-
          Kubernetes, «Памятка-оси» — целиком: по ним выводишь ответ, когда факт не вспомнился.
      - name: Сети
        how: >-
          Справочник сетевого конспекта: часть 1 бегло, часть 2 (кейсы) вслух, «Философия» и «Мои
          личные грабли».
      - name: Карточки защиты
        how: >-
          Журнал 08.11 (блок 1) и 17.11 (блок 2) — вслух, как ответ на «расскажите о проекте».
      - name: Темы вакансии
        how: По темам из вакансии — «Проверь себя» и «Как рассказать на собесе» по их шагам.
      - name: Резюме
        how: >-
          `interview/resume-map.md` 🔒 — по каждой строке резюме вспомнить шаг и цифру. Затем
          `interview/rbac.md` 🔒.

consolidated: {}

topics:
  - id: 1
    title: Архитектура кластера и оси
    area: Кластер
    status: done
    done: '2026-11-09'
    brief: >-
      Кластер — это apiserver, через который ходят все, etcd, где лежит всё состояние, и контроллеры,
      которые в цикле доводят «как есть» до «как должно быть». В kubeadm сам control plane — статические
      поды: их запускает kubelet по файлам на диске, без всякого API. Три мастера нужны ради кворума
      etcd, а VIP с HAProxy — чтобы клиенты не зависели от одного адреса. В лабе HA собран, измерен
      и потом свёрнут обратно в один мастер ради ядер.
    steps: [1-7, 2-7]
    read:
      - title: Cluster Architecture
        url: https://kubernetes.io/docs/concepts/architecture/
        note: >-
          Кто есть кто в кластере и кто с кем говорит. В конце — варианты развёртывания, включая
          статические поды, как у kubeadm.
        lang: en
        min: 10
      - title: Options for Highly Available Topology
        url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/ha-topology/
        note: >-
          Stacked etcd против отдельного кластера etcd: что падает вместе и сколько машин нужно.
        lang: en
        min: 4
      - title: 'The Secret Lives of Data: Raft'
        url: https://thesecretlivesofdata.com/raft/
        note: >-
          Анимация: как участники etcd выбирают лидера и почему запись проходит только при большинстве.
          Самое наглядное объяснение кворума.
        lang: en
        min: 10
    questions:
      - q: Кто запускает control plane в kubeadm-кластере, если apiserver ещё нет?
        a: >-
          kubelet — по манифестам из `/etc/kubernetes/manifests`: apiserver, etcd, scheduler и
          controller-manager поднимаются без всякого API. В `kubectl` видно только их отражение
          (mirror-под), поэтому `kubectl delete pod` их не перезапускает: манифест выносят из каталога
          и возвращают.
      - q: Кто с кем говорит в кластере?
        a: >-
          Все говорят только с apiserver, и только он ходит в etcd. Scheduler выбирает поду ноду,
          контроллеры доводят фактическое состояние до желаемого, kubelet запускает контейнеры через
          containerd и пишет статус. Друг друга напрямую они не зовут — каждый следит за своими
          объектами через watch.
      - q: Почему мастеров три, а не два?
        a: >-
          etcd принимает запись, только когда согласно большинство участников — кворум. Из двух нужны
          оба: падение любого останавливает запись, и это хуже одного мастера. Три переживают потерю
          одного, пять — двух, чётное число ничего не добавляет.
      - q: Stacked etcd или отдельный кластер etcd?
        a: >-
          Stacked — etcd на тех же мастерах: меньше машин, kubeadm так делает по умолчанию, но мастер
          и участник etcd падают вместе и делят один диск. Отдельный etcd — ещё три машины ради
          изоляции. Для небольшого кластера stacked — нормальный выбор.
      - q: Как работал VIP в GCP и зачем HAProxy, если VIP уже есть?
        a: >-
          keepalived выбирает главного мастера, но сеть GCP не верит ARP: новый главный сам через API
          облака перевешивает alias IP на себя. VIP ведёт на одну машину, а HAProxy на ней раздаёт
          соединения всем живым apiserver, проверяя `/readyz`. Переключение в лабе — около 9 секунд.
      - q: Упали два мастера из трёх. Что с кластером?
        a: >-
          Кворума etcd нет: записи не проходят, управлять кластером нельзя, но уже запущенные поды
          работают. Вернулись мастера — кворум соберётся сам. Не вернулись — etcd на выжившем участнике
          с `--force-new-cluster` или восстановление из снимка, потом участников добавляют заново.
      - q: Почему HA свернули обратно в один мастер и как убирали мастера?
        a: >-
          Триал держит включёнными только 8 ядер, все были заняты, а потерю воркера кластер уже не
          переживал — горел `WorkersOvercommit`. HA к тому времени был собран и отрепетирован, и ядра
          двух мастеров ушли под третий воркер. Убирали по одному через `kubeadm reset`, чтобы кворум
          etcd был на каждом шаге.
    lab: ['01-cluster — до раздела «etcd»', '14-ha-control-plane — целиком']
    gdoc: ['Kubernetes: «Памятка-оси»', 'Kubernetes: M1, M2, M3']
    seen: [situations/kubectl-no-connection, runbooks/components-down, runbooks/workers-overcommit]
    drill: ['k8s: architecture, kubelet-runtime, api-model']

  - id: 2
    title: 'Prometheus изнутри: сбор метрик и экспортеры'
    area: Наблюдаемость
    status: now
    brief: >-
      Prometheus сам ходит за цифрами: раз в полминуты опрашивает по HTTP страницы `/metrics` у
      сервисов и экспортеров — это модель pull. Кого опрашивать, он узнаёт из Kubernetes: в
      kube-prometheus-stack это объекты ServiceMonitor. Экспортер — переводчик: читает чужие данные
      (ядро ноды, объекты API, внешний сайт) и отдаёт их в формате Prometheus. Точки лежат в его
      собственной базе временных рядов на диске. Главный урок ревизии 2-1: горящий Watchdog ещё не
      значит, что данные пишутся.
    steps: [2-1]
    read:
      - title: 'Learn Prometheus Architecture: A Complete Guide'
        url: https://devopscube.com/prometheus-architecture/
        note: >-
          Из чего состоит Prometheus: опрос целей, база временных рядов, поиск целей, экспортеры,
          Pushgateway, Alertmanager — со схемами.
        lang: en
        min: 14
      - title: kube-state-metrics — README
        url: https://github.com/kubernetes/kube-state-metrics
        note: >-
          Что отдаёт kube-state-metrics и чем он отличается от metrics-server. Хватит начала и раздела
          «kube-state-metrics vs. metrics-server».
        lang: en
        min: 6
    questions:
      - q: Pull или push — как Prometheus получает метрики и почему так?
        a: >-
          Сам опрашивает цели по HTTP (`/metrics`) с заданным интервалом. Так Prometheus сам решает,
          какую нагрузку держать, а мёртвая цель сразу видна: у каждой цели есть метрика `up`, и
          `up == 0` — первое, что ставят в алерт. Для коротких задач, которые не доживают до опроса,
          есть Pushgateway.
      - q: node-exporter, kube-state-metrics, cAdvisor — в чём разница?
        a: >-
          node-exporter — железо и ОС ноды: CPU, память, диски. kube-state-metrics — состояние
          объектов API: сколько реплик готово, сколько рестартов. cAdvisor встроен в kubelet и даёт
          реальное потребление контейнеров (`container_*`). «Деплоймент деградировал» — это
          kube-state-metrics, «под ест память» — cAdvisor.
      - q: Создал ServiceMonitor, а цели в Prometheus нет. Что проверяешь?
        a: >-
          Подхватывает ли Prometheus чужие ServiceMonitor: в kube-prometheus-stack по умолчанию — только
          свои. Совпадает ли selector с метками Service (не пода), указан ли порт по имени из Service,
          пускает ли namespaceSelector. Дальше — страница targets и логи prometheus-operator. Ещё
          скрейп может молча резать NetworkPolicy.
      - q: Почему дашборды scheduler, controller-manager и etcd были пустыми?
        a: >-
          В kubeadm они слушают только `127.0.0.1`, и Prometheus из пода до них не достаёт. Открыли
          `bind-address=0.0.0.0`, но не `sed`'ом по манифестам, а в `kubeadm-config`: иначе
          `kubeadm upgrade` пересоберёт манифесты и правку сотрёт.
      - q: Watchdog горит — значит, мониторинг работает?
        a: >-
          Нет. Watchdog горит, пока живы Prometheus и Alertmanager, даже если в базу не пишется ни одной
          точки. В лабе так прошли двое суток: часы на ноде убегали на два года вперёд, и база
          отбрасывала всё новое как устаревшее. Смерть мониторинга ловит внешний сторож по Watchdog,
          слепоту — своё правило «данных нет».
      - q: Зачем пересматривать 159 готовых правил до подключения Telegram?
        a: >-
          Чтобы не утонуть в шуме: первым же утром пришло бы 20 сообщений, половина про ерунду, и через
          неделю их перестали бы читать. По каждой группе решали — оставить, заглушить или
          переписать. Часть правил оказалась неверной для нашей схемы: запас памяти на случай потери
          воркера считался вместе с мастерами.
      - q: Падение одной ноды унесло весь мониторинг. Что менять?
        a: >-
          В лабе Prometheus, Alertmanager и Loki жили на дисках одной ноды, и при её отказе алерт
          слать стало некому. Минимум — внешний сторож на Watchdog. Дальше — реплики на разных нодах,
          сетевое хранилище или remote_write во внешнее хранилище.
    lab: ['03-observability — «Из чего собран мониторинг», «Как Prometheus узнаёт, кого опрашивать», «Метрики control-plane», «Ревизия алертов»']
    gdoc: ['Kubernetes: M20']
    seen: [situations/monitoring-lies, situations/monitoring-node-down, runbooks/prometheus-no-data]
    drill: ['k8s: observability']

  - id: 3
    title: 'PromQL и Grafana: запросы и дашборды'
    area: Наблюдаемость
    status: todo
    brief: >-
      PromQL — язык вопросов к Prometheus. Счётчик только растёт, поэтому у него смотрят не значение, а
      скорость — `rate()`. Gauge — текущее значение, его берут как есть. Задержку считают из гистограммы:
      `histogram_quantile()` по корзинам. Grafana сама ничего не хранит: панель — это запрос к источнику
      данных плюс оформление. Дашборд «Обзор лаба» лежит JSON-ом в git, его пороги совпадают с
      алертами, а первое, что он показал, — алерты на ingress стерегли пустоту.
    steps: [2-6]
    read:
      - title: Understanding metric types
        url: https://prometheus.io/docs/tutorials/understanding_metric_types/
        note: >-
          Четыре типа метрик и как запрашивать каждый: `rate` для счётчика, `histogram_quantile` для
          гистограммы.
        lang: en
        min: 4
      - title: Grafana — Dashboards overview
        url: https://github.com/grafana/grafana/blob/main/docs/sources/fundamentals/dashboards-overview/index.md
        note: >-
          Цепочка Grafana: источник данных → запрос → панель → дашборд. Это страница документации в
          репо Grafana: grafana.com из РБ без VPN отдаёт 451.
        lang: en
        min: 9
    questions:
      - q: rate, irate, increase — когда что?
        a: >-
          Все три работают со счётчиками и переживают их сброс при рестарте. `rate` — средний прирост в
          секунду за окно, для алертов и графиков. `irate` — по двум последним точкам, дёрганый, только
          для графиков всплесков. `increase` — прирост в штуках, «сколько рестартов за час». Окно —
          минимум в 4 раза больше интервала опроса.
      - q: Counter, gauge, histogram — чем отличаются и как их запрашивать?
        a: >-
          Counter только растёт и сбрасывается при рестарте — к нему `rate` или `increase`. Gauge ходит
          вверх и вниз — берут как есть или `avg_over_time`. Histogram раскладывает наблюдения по
          корзинам `_bucket`, перцентиль считает
          `histogram_quantile(0.99, sum by (le) (rate(..._bucket[5m])))`.
      - q: Почему память пода смотрят по working_set, а не по usage?
        a: >-
          `container_memory_usage_bytes` включает page cache, который ядро отдаст по первому требованию,
          — по нему все выглядят прожорливыми. Working set — то, что вытеснить нельзя, по нему kubelet
          решает выселение. Алерт «скоро OOM» — working_set против limit.
      - q: Плитка показывает «No data», хотя всё хорошо. Почему?
        a: >-
          `count(<плохое>)` при нуле проблем возвращает пустой результат, а не 0. Добавляют
          `or vector(0)`. С долей ошибок то же: рядов с 5xx нет — линия пропадает, поэтому
          `ошибки or 0 * запросы`.
      - q: Как хранишь дашборды Grafana?
        a: >-
          JSON-ом в git: kustomize собирает из файла ConfigMap с меткой, сайдкар Grafana его
          подхватывает, ArgoCD выкатывает. Сохранить в интерфейсе нельзя — правка через экспорт JSON и
          коммит. В CI проверяются JSON, uid и источники данных: битый файл Grafana пропускает молча.
      - q: Почему дашборд и алерт не должны считать по-разному?
        a: >-
          Иначе на дашборде всё зелёное, а алерт горит, и непонятно, кому верить. У нас пороги плиток
          совпадают с порогами алертов, а цифры берутся из тех же recording rules.
      - q: Что дашборд показал сразу после выкатки?
        a: >-
          Через ingress шло 0.03 запроса в секунду — только внешние пробы. Генератор нагрузки ходил в
          магазин мимо ingress, и алерты на ошибки и задержку ingress стерегли пустоту. Генератор
          пустили через ingress внутри сети: через публичный адрес это был бы платный исходящий трафик.
    lab: ['03-observability — «PromQL: минимум, который нужен», «Дашборд «Обзор лаба»»']
    gdoc: ['Kubernetes: M20']
    seen: []
    drill: ['k8s: observability']

  - id: 4
    title: Алерты и дежурство
    area: Наблюдаемость
    status: todo
    brief: >-
      Prometheus решает, что сломалось, а Alertmanager — кому, когда и как об этом сказать: склеивает
      похожие алерты в одно сообщение, глушит лишнее и шлёт в Telegram с разной срочностью. Хороший алерт
      — про симптом, который видит пользователь (ошибки, задержка), а не про «CPU 80%». Каждое своё
      правило проверено юнит-тестом, а в каждом сообщении есть ссылка на runbook — что делать в три
      часа ночи. О смерти самого мониторинга сообщает внешний сторож: тишина в чате не значит «всё
      хорошо».
    steps: [2-2, 2-3, 2-4]
    read:
      - title: Alertmanager
        url: https://prometheus.io/docs/alerting/latest/alertmanager/
        note: >-
          Группировка, inhibition, silence и маршруты — четыре инструмента против шума.
        lang: en
        min: 4
      - title: Monitoring Distributed Systems — Google SRE Book, глава 6
        url: https://sre.google/sre-book/monitoring-distributed-systems/
        note: >-
          Почему алертить на симптомы, а не на причины, и четыре золотых сигнала: задержка, трафик,
          ошибки, насыщение. Главное — разделы про симптомы и причины и про золотые сигналы.
        lang: en
        min: 15
    questions:
      - q: Что делает Alertmanager, если Prometheus уже решил, что сломалось?
        a: >-
          Решает, кому, когда и как сказать. Группирует похожие алерты в одно сообщение, разводит их по
          срочности (critical — со звуком и напоминанием каждые 2 часа), глушит лишнее через inhibit и
          silence. Сам ничего не вычисляет — только доставляет.
      - q: group_wait, group_interval, repeat_interval — что каждый делает?
        a: >-
          `group_wait` — сколько ждать после первого алерта группы, чтобы собрать соседей в одно
          сообщение (у нас 30 с). `group_interval` — как часто слать, если в группе появилось новое
          (5 мин). `repeat_interval` — когда напомнить, если ничего не поменялось: critical — 2 ч,
          warning — 12 ч.
      - q: Как убирать шум — silence, inhibit, отключить правило или маршрут?
        a: >-
          Silence — временно: на работы или до починки известной проблемы, со сроком и комментарием.
          Inhibit — когда один алерт объясняет другие: нода упала — не слать про каждый её под.
          Отключить правило — если оно неверно для твоей схемы, и написать своё. Маршрут — алерт верный,
          но не срочный: в тихий канал.
      - q: Зачем внешний сторож, если есть Alertmanager?
        a: >-
          Если умрёт Alertmanager, его нода или весь кластер, сообщить будет некому, а тишина выглядит
          как «всё хорошо». Watchdog горит всегда и раз в минуту уходит во внешний сервис; пропали пинги
          на 5 минут — тот пишет в Telegram своим ботом. На плановое гашение лаба сторож ставится на
          паузу.
      - q: Почему алерт на симптомы лучше, чем «CPU 80%»?
        a: >-
          Пользователю всё равно, насколько занят процессор: ему важно, отвечает ли сайт и как быстро.
          Поэтому алертим на долю 5xx и p99 через ingress. Подвох: при маленьком трафике одна ошибка —
          это десятки процентов, нужен порог по трафику, а без трафика такой алерт молчит — нужны
          проверки снаружи.
      - q: Как проверяешь, что алерт сработает, до того как он понадобится?
        a: >-
          Юнит-тестами `promtool test rules`: подаю выдуманные ряды и жду конкретный алерт с нужными
          метками — и обратный случай, где он молчит. Тесты гоняет CI на каждый push. И один раз ломаю
          правило руками: тест, который ни разу не падал, ничего не доказывает.
      - q: Зачем в правиле `for` и чем за него платишь?
        a: >-
          Чтобы не будить из-за того, что было плохо пару минут: рестарт, выкатка, перевыборы лидера.
          У нас после подъёма лаба цели первые минуты не видны, и `for: 15m` отсекает ложные `*Down`.
          Цена — о настоящей поломке тоже узнаешь на 15 минут позже.
      - q: Зачем runbook, если есть алерт?
        a: >-
          Алерт будит, runbook говорит, что делать, пока не проснулся до конца: чем грозит, что
          проверить, как починить, когда звать на помощь. Ссылка — прямо в сообщении и открывается с
          телефона. У готовых правил каждая четвёртая ссылка вела на 404, поэтому runbook'и свои.
    lab: ['03-observability — «Alertmanager → Telegram», «Свои правила алертов», «Runbook''и»']
    gdoc: ['Kubernetes: M20']
    seen: [runbooks/triage, runbooks/inotify]
    drill: ['k8s: observability']

  - id: 5
    title: 'Данные кластера: etcd, шифрование, бэкап'
    area: Кластер
    status: todo
    brief: >-
      etcd — база, где Kubernetes хранит всё: каждый под, секрет и настройку. apiserver — вежливый
      посредник перед ней: проверяет права и формат, а хранит etcd. Потерял etcd — потерял кластер, даже
      если все машины живы. Каждое изменение двигает общий счётчик — ревизию, и `resourceVersion` объекта
      и есть номер ревизии. Secret по умолчанию лежит в etcd открытым текстом, поэтому включено
      шифрование, а бэкап — всегда пара «снимок + ключ шифрования», и хранятся они раздельно.
    steps: [1-1, 1-2, 1-3]
    read:
      - title: etcd — Data model
        url: https://etcd.io/docs/v3.6/learning/data_model/
        note: >-
          Ревизии, версии ключей и компакция — то, на чём держатся `resourceVersion` и watch в
          Kubernetes.
        lang: en
        min: 4
      - title: Encrypting Confidential Data at Rest
        url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
        note: >-
          Как apiserver шифрует данные перед записью в etcd. Хватит разделов про устройство конфига и
          про ротацию ключа.
        lang: en
        min: 10
    questions:
      - q: Что такое resourceVersion и зачем он нужен?
        a: >-
          Номер ревизии etcd, когда объект меняли последний раз; счётчик общий на весь кластер. На нём
          держится оптимистичная блокировка: update со старым resourceVersion получает 409 Conflict,
          клиент перечитывает объект и повторяет. И watch: «дай всё, что изменилось после ревизии N».
      - q: Контроллер пишет «too old resource version», 410 Gone. Это авария?
        a: >-
          Нет, обычная жизнь: он хотел продолжить watch с ревизии, которую уже выкинула компакция
          (apiserver делает её раз в 5 минут). Ответ — перечитать список целиком и снова встать на watch.
          Плохо, только если это идёт непрерывно.
      - q: etcd ушёл в NOSPACE и не принимает записи. Порядок действий?
        a: >-
          Понять, кто раздул базу: у нас треть занимали events. Затем компакция, defrag по одному
          участнику за раз — на время defrag участник не отвечает, кворум надо беречь — и
          `etcdctl alarm disarm`. Если база правда выросла — поднять квоту, по умолчанию 2 GiB.
      - q: Secret в Kubernetes зашифрован?
        a: >-
          Из коробки нет: base64 — не шифрование, и в etcd значение лежит открытым — пароль Postgres
          находился `grep`'ом по базе. Шифрование включается в apiserver, ключ лежит в файле на мастере, в
          etcd его нет. От `kubectl get secret` с правами на чтение оно не защищает — только от утёкших
          снимков и доступа к самой базе.
      - q: Как ротировать ключ шифрования без остановки?
        a: >-
          Новый ключ вторым в списке и перечитать на всех apiserver; потом новый ключ первым; потом
          перезаписать все секреты, чтобы перешифровались; и только потом убрать старый. Если один
          apiserver начнёт писать новым ключом раньше, чем другие его узнают, они не прочитают секреты.
          Процедура отрепетирована заранее: она нужна в плохой день, когда утёк бэкап.
      - q: Что попадает в снимок etcd, а что нет?
        a: >-
          Все объекты API на момент снимка — у нас 30 MB за 0.9 с, запись при этом не блокируется. Не
          попадают данные в томах, сертификаты из `/etc/kubernetes/pki` и ключ шифрования. Без ключа
          секреты из снимка не прочитать. Снимок на диске той же ноды — не бэкап.
      - q: Как восстанавливал etcd из снимка и как проверил, что сработало?
        a: >-
          Остановил все статические поды control plane (scheduler и controller-manager держат картину
          кластера в памяти), развернул снимок `etcdutl` в новый каталог с `--bump-revision`, чтобы
          ревизия не ушла назад, и вернул манифесты — около 10 минут. Удалять для проверки что-то из
          gitops бессмысленно: ArgoCD вернёт это и без восстановления. Проверял данными вне git:
          ConfigMap до снимка вернулся, созданный после — пропал, секрет расшифровывается.
      - q: Удалили секрет — его больше нигде нет?
        a: >-
          Есть: до компакции старая версия читается из etcd по ревизии и навсегда остаётся во всех
          снимках, сделанных до удаления. Утёкший секрет удалением не лечится — только сменой самого
          пароля или токена.
    lab: ['01-cluster — «etcd — это и есть кластер»', '13-security — «Шифрование секретов в etcd»', '12-operations — «etcd: бэкап», «etcd: восстановление»']
    gdoc: ['Kubernetes: M22 — только сверка с лабом']
    seen: [situations/etcd-restore, runbooks/etcd, runbooks/backups]
    drill: ['k8s: bootstrap, config-secrets']

  - id: 6
    title: 'CD и GitOps: ArgoCD, Kustomize, stage → prod'
    area: Выкатка
    status: todo
    brief: >-
      GitOps — состояние кластера описано в git, а агент внутри кластера сам тянет его и сверяет с живым:
      это pull, а не push. В лабе этот агент — ArgoCD. CI в кластер не ходит и ключей от него не имеет: он
      только пишет одну строку — тег образа — в gitops-репо. Stage получает каждый зелёный коммит `main`,
      prod — тот же образ, проверенный на stage, по кнопке `promote`, а откат — та же кнопка со старым
      тегом. Окружения собираются Kustomize из общей базы и маленьких overlay со своим тегом и базой
      данных.
    steps: [3-3]
    read:
      - title: Argo CD — Architectural Overview
        url: https://argo-cd.readthedocs.io/en/stable/operator-manual/architecture/
        note: >-
          Три компонента: API server, repo server, который рендерит манифесты, и application controller,
          который сравнивает git с кластером и синхронизирует.
        lang: en
        min: 3
      - title: Declarative Management of Kubernetes Objects Using Kustomize
        url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
        note: >-
          Base и overlays, генераторы, патчи strategic merge и JSON6902. Главное — разделы про
          bases/overlays и про патчи.
        lang: en
        min: 15
      - title: OpenGitOps — принципы
        url: https://opengitops.dev/
        note: >-
          Четыре принципа GitOps: декларативно, версионировано, тянется автоматически, постоянно
          сверяется.
        lang: en
        min: 2
    questions:
      - q: Зачем GitOps, если можно `kubectl apply` из CI?
        a: >-
          Pull вместо push: ArgoCD живёт в кластере и сам тянет git, поэтому у CI нет кредов от кластера,
          и взлом CI не даёт кластер. Кластер постоянно сверяется с git и возвращает ручные правки
          (selfHeal), история выкаток — история коммитов, откат — коммит. Цена: всё, чего нет в git,
          пропадёт при следующей синхронизации.
      - q: Как устроен CD в лабе — кто что пушит?
        a: >-
          CI после зелёного `main` публикует образ с тегом по sha и коммитит тег в overlay stage. ArgoCD
          видит коммит и выкатывает. В prod — кнопка `promote`: тот же тег коммитится в overlay prod. В
          кластер ходит только ArgoCD.
      - q: Почему в prod идёт тот же образ, а не пересобранный?
        a: >-
          Пересборка — уже другой артефакт: другие базовые слои и зависимости, на stage его не проверяли.
          Поэтому образ собирается один раз, а между окружениями продвигается тег. `promote` по умолчанию
          берёт тег прямо из overlay stage и перед коммитом проверяет, что образ есть в реестре.
      - q: Почему тег — sha коммита, а не `latest`?
        a: >-
          `latest` изменяемый: в манифесте ничего не меняется, ArgoCD не видит выкатки, а на разных нодах
          могут крутиться разные образы. По sha видно коммит, и тег не меняется. Строже — digest
          `@sha256:`, но его не прочитать глазами.
      - q: Пайплайн выкатки зелёный — значит, выкатилось?
        a: >-
          Нет: зелёный `promote` — это коммит в gitops. ArgoCD опрашивает git раз в 3 минуты и применяет
          последнее состояние, а не каждый коммит: три promote за две минуты дали одну синхронизацию.
          Проверять надо образ и версию в логе нового пода и историю синхронизаций приложения.
      - q: Что такое app of apps?
        a: >-
          Корневое Application смотрит на каталог `apps/`, где каждый файл — тоже Application. Добавил
          файл — появилось приложение, удалил — приложение и его ресурсы удалятся. Для однотипных
          приложений по кластерам или окружениям вместо этого берут ApplicationSet.
      - q: Чем strategic merge патч в Kustomize опасен для `env`?
        a: >-
          Он сливает список по имени, но изменённые элементы может переставить. А `$(POD_NAME)`
          раскрывается, только если `POD_NAME` объявлена выше, — у нас ссылка сломалась. Для списков,
          где важен порядок, — JSON6902-патч по индексу с `op: test`: если базу переставят, упадёт
          сборка, а не выкатка.
      - q: Приложение вечно OutOfSync, хотя никто ничего не менял. Почему?
        a: >-
          Полем владеет кто-то ещё: HPA меняет `replicas`, вебхук дописывает значение по умолчанию, чарт
          генерирует случайный пароль на каждый рендер. ArgoCD приводит к git, другой контроллер — обратно.
          Лечится `ignoreDifferences` на это поле или удалением поля из манифеста.
      - q: Кто может выдать себе cluster-admin в GitOps-кластере?
        a: >-
          Любой, кто может пушить в gitops-репо: ArgoCD применяет манифесты своим ServiceAccount с
          полными правами. Поэтому защита ветки и ревью — часть контроля доступа, а внутри ArgoCD права
          режут AppProject: из каких репо, в какие namespace и какие типы ресурсов можно.
    lab: ['05-argocd — целиком', '15-app-service — «CD: GHCR → тег в gitops → ArgoCD»']
    gdoc: ['Kubernetes: M21']
    seen: [situations/argocd-overwrote, runbooks/argocd]
    drill: ['k8s: packaging-gitops', 'cicd: argocd, deployment-strategies']

  - id: 7
    title: 'Наблюдаемость своего сервиса: RED, трейсы, логи'
    area: Наблюдаемость
    status: todo
    brief: >-
      Хороший сервис рассказывает о себе сам: жив ли он (`/healthz`), готов ли принимать запросы
      (`/readyz`), сколько запросов, ошибок и как быстро (`/metrics`, метод RED) и что было с конкретным
      запросом (трейс). Трейс — дерево спанов: каждый спан — одна операция со временем начала и
      длительностью, а общий trace ID едет между сервисами в заголовке `traceparent`. Тот же trace ID
      пишется в строки лога. Цикл дежурного: метрики говорят «что и когда», трейсы — «где», логи —
      «почему».
    steps: [3-1]
    read:
      - title: Observability primer — OpenTelemetry
        url: https://opentelemetry.io/docs/concepts/observability-primer/
        note: >-
          Логи, метрики и трейсы; что такое спан, трейс и как контекст запроса едет между сервисами.
        lang: en
        min: 7
    questions:
      - q: Какие метрики нужны любому сервису?
        a: >-
          RED: скорость запросов (Rate), ошибки (Errors) и длительность (Duration) — гистограммой, чтобы
          считать p95 и p99. Это то, что видит пользователь. Для ресурсов — нод и дисков — есть парный
          метод USE: загрузка, насыщение, ошибки.
      - q: Почему метка маршрута — шаблон, а не URL?
        a: >-
          Каждое уникальное значение метки — отдельный ряд в Prometheus. С путём `/api/notes/123` рядом
          стал бы каждый id, и число рядов росло бы без предела. Шаблон `/api/notes/{id}` даёт один ряд
          на маршрут.
      - q: Что такое трейс и как он связывает сервисы?
        a: >-
          Дерево спанов: спан — одна операция с началом, длительностью и родителем. Общий trace ID
          передаётся в заголовке W3C `traceparent`; сервис не пробросил заголовок дальше — трейс рвётся
          на два. Через Kafka контекст едет в заголовках сообщения.
      - q: Зачем OpenTelemetry Collector, если сервис может слать трейсы прямо в Jaeger?
        a: >-
          Сервис знает только протокол OTLP и адрес коллектора, а куда раскладывать трейсы, метрики и
          логи, решает конфиг коллектора — бэкенд меняется без правки кода. Коллектор же собирает
          данные пачками, повторяет отправку, добавляет метки Kubernetes и делает сэмплинг.
      - q: Трейсов слишком много, и это дорого. Что делать?
        a: >-
          Сэмплинг. Head — решение на входе (берём 10% запросов): дёшево, но редкие ошибки теряются.
          Tail — в коллекторе, когда трейс закончен: все с ошибками и медленные сохранить, от остальных —
          процент. Дороже по памяти коллектора, зато интересное не теряется.
      - q: Зачем логам сервиса JSON и trace_id?
        a: >-
          JSON-строку Loki хранит как есть и разбирает в запросе (`| json`), поля не надо выковыривать
          регулярками. trace_id в каждой строке связывает лог с трейсом: по нему находишь все строки
          конкретного запроса.
      - q: Опиши путь дежурного от алерта до причины.
        a: >-
          Метрики говорят «что и когда»: выросла доля ошибок у сервиса. Трейс — «где»: красный спан у
          зависимости. Логи — «почему»: текст ошибки в момент спана, найденный по trace_id. Переход
          между ними — по времени, сервису и trace_id.
    lab: ['15-app-service — «Сервис и наблюдаемость»', '07-microservices-otel-demo — целиком']
    gdoc: ['Kubernetes: M20', 'Сети: M18, разделы 4–6 (p99, RED/USE)']
    seen: []
    drill: ['k8s: observability']

  - id: 8
    title: Поды, контроллеры и пробы
    area: Приложения
    status: todo
    brief: >-
      Под — один или несколько контейнеров с общей сетью, но руками поды не создают: Deployment управляет
      ReplicaSet, а тот следит, чтобы подов было сколько нужно. StatefulSet — для тех, кому нужна
      постоянная личность: имя, свой том, порядок запуска. Пробы говорят kubelet, что с подом: liveness —
      жив ли процесс (нет — перезапуск), readiness — можно ли слать трафик (нет — под убирают из Service),
      startup — дать медленному приложению проснуться. Главная ловушка — проверять зависимости не там: в
      3-5 readiness через общий пул устроила каскадный отказ.
    steps: [3-5]
    read:
      - title: Pod Lifecycle
        url: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
        note: >-
          Фазы и условия пода, политика рестарта, пробы и как под завершается. Хватит разделов про фазы,
          пробы и завершение пода.
        lang: en
        min: 15
      - title: 'Liveness and Readiness Probes: How to Avoid Shooting Yourself in the Foot'
        url: https://blog.colinbreck.com/kubernetes-liveness-and-readiness-probes-how-to-avoid-shooting-yourself-in-the-foot/
        note: >-
          Почему зависимости нельзя проверять в liveness и как readiness устраивает каскадный отказ —
          ровно история 3-5.
        lang: en
        min: 14
    questions:
      - q: liveness, readiness, startup — в чём разница?
        a: >-
          Провал liveness — контейнер убивают и перезапускают. Провал readiness — под убирают из Service,
          но не трогают. Startup выключает остальные пробы, пока приложение прогревается, иначе медленное
          приложение убьёт liveness ещё на старте.
      - q: Почему базу нельзя проверять в liveness?
        a: >-
          База моргнула — liveness провалилась у всех подов сразу, kubelet перезапускает их по кругу, а
          базу это не чинит и добивает лишними соединениями. Зависимости — только в readiness. У нас
          `/healthz` базу не трогает, а `/readyz` её пингует.
      - q: Как readiness может устроить каскадный отказ?
        a: >-
          Все реплики проверяют общий ресурс, который под нагрузкой медленный. Одна выпала, её трафик ушёл
          на остальные — они выпали быстрее. У нас проверка шла через общий пул соединений: медленный
          поиск занял пул, под выпал из Service, и из 482 тысяч запросов прошло 512. Лечение — своё
          соединение для проверки: «жива ли база», а не «есть ли место в пуле».
      - q: Под в CrashLoopBackOff. Порядок диагностики?
        a: >-
          `kubectl describe pod`: Last State, Reason и Exit Code — 137 с `OOMKilled` это память, 1 —
          ошибка приложения, 127 — нет бинаря. Потом `kubectl logs --previous`: причина в логе прошлого
          контейнера. Затем события: проваленные пробы, несмонтированный секрет.
      - q: Зачем между Deployment и подами ещё ReplicaSet?
        a: >-
          Обновление — это два ReplicaSet сразу: новый растёт, старый сжимается. Старые остаются с нулём
          реплик — это и есть история откатов: `rollout undo` масштабирует старый обратно. Поэтому при
          откате на прежний образ Deployment поднял прежний ReplicaSet, а не создал новый.
      - q: Когда StatefulSet, а не Deployment?
        a: >-
          Когда поду нужна постоянная личность: стабильное имя (`postgres-0`), своё DNS-имя через
          headless-сервис и свой том, который переживает пересоздание. Это базы и брокеры. При отказе ноды
          StatefulSet не создаёт замену, пока старый под не удалён: двух `postgres-0` быть не может.
      - q: Что происходит при удалении пода и как не терять запросы?
        a: >-
          Одновременно kubelet шлёт SIGTERM, а под убирают из Service; до kube-proxy и ingress это доходит
          через секунды. Если выйти сразу, запросы в эти секунды получат ошибку. Поэтому сервис сначала
          отвечает «не готов», ждёт 5 секунд, дорабатывает начатое и только потом выходит — всё в пределах
          `terminationGracePeriodSeconds`.
      - q: Как сделать обновление без простоя?
        a: >-
          `maxUnavailable: 0` и `maxSurge: 1`: новый под поднимается раньше, чем гасится старый. Главное —
          readiness: rollout ждёт готовности нового пода, а без пробы трафик пойдёт в неготовое приложение.
          Плюс корректная остановка по SIGTERM.
    lab: ['04-workloads — «Deployment против StatefulSet», «Три пробы»', '11-objects-and-service-network — «Deployment → ReplicaSet → Pod», «Метки и селекторы»', '15-app-service — «Сервис и наблюдаемость»']
    gdoc: ['Kubernetes: M4, M5, M6']
    seen: [situations/crashloop-at-start, runbooks/pods]
    drill: ['k8s: pods, probes, workload-controllers, labels-selectors']

  - id: 9
    title: 'Логи: Fluent Bit, Loki, алерты по логам'
    area: Наблюдаемость
    status: todo
    brief: >-
      Fluent Bit на каждой ноде читает файлы логов подов, как `tail -f`, помнит, докуда дочитал, и
      приклеивает к строке «адрес»: неймспейс, приложение, контейнер, нода. Loki индексирует только этот
      адрес — метки, а сам текст хранит сжатыми кусками и при поиске читает их подряд. Поэтому меток мало:
      каждая новая комбинация — отдельный поток. Алерты по логам считает ruler Loki и шлёт в тот же
      Alertmanager. Главный урок: пайплайн логов ломается молча, поэтому за сборщиком, Loki и ruler
      смотрит Prometheus.
    steps: [2-8, 2-9]
    read:
      - title: Loki overview
        url: https://github.com/grafana/loki/blob/main/docs/sources/get-started/overview.md
        note: >-
          Индекс только по меткам, текст — сжатыми кусками, отсюда правило «меток мало». Это страница
          документации в репо Loki: grafana.com из РБ без VPN отдаёт 451.
        lang: en
        min: 9
      - title: Fluent Bit — Key concepts
        url: https://docs.fluentbit.io/manual/concepts/key-concepts
        note: >-
          Событие, тег, запись и маршрутизация по тегам — из чего собран пайплайн Fluent Bit.
        lang: en
        min: 5
    questions:
      - q: Почему Loki дешевле Elasticsearch и где подвох?
        a: >-
          Loki индексирует только метки, а текст хранит сжатыми кусками и при поиске читает подряд.
          Подвох — меток должно быть мало: метка с request_id или именем пода плодит потоки и убивает
          установку. У нас метки namespace, app, container и node, а pod лежит в structured metadata.
      - q: Разбирать JSON-логи в сборщике или при запросе?
        a: >-
          Зависит от хранилища. Elasticsearch индексирует поля — там разбирают при записи. Loki
          индексирует только метки, поэтому строка хранится как есть, а `| json` — в запросе. Поля в
          метках — верный способ убить Loki числом потоков.
      - q: Как Fluent Bit не теряет строки, если Loki лежит?
        a: >-
          Позицию чтения каждого файла он хранит на диске ноды, а неотправленное складывает в буфер на
          диске и досылает, когда Loki вернётся. При первом запуске читает с конца файлов, чтобы не слать
          старое. Памяти ему хватает 14–36 МБ на ноду.
      - q: Retention в Loki выставлен, а логи не удаляются. Почему?
        a: >-
          Удаляет compactor, и только с `retention_enabled: true`. Без этого `retention_period` — просто
          цифра в конфиге. У нас так было с первого дня: лежали логи двухнедельной давности.
      - q: Loki отбрасывает строки с `too_far_behind`. Что это?
        a: >-
          Строка старше последней, уже принятой в этом потоке. Часы на ноде когда-то убегали на два года
          вперёд, Loki принял строки «из 2028-го» и потом неделю выбрасывал все нормальные строки этих
          потоков — около 23%. Видно по `loki_discarded_samples_total`, но метрик Loki в Prometheus
          тогда не было.
      - q: Когда алерт по логам, а когда по метрикам?
        a: >-
          По метрикам всё, что можно: дешевле и не ломается от смены формата лога. По логам — когда
          метрики нет или смысл только в тексте: почему не скачивается образ (401 и «тег удалён» лечатся
          по-разному), неудачные входы в ArgoCD и Grafana.
      - q: Что может молча сломаться в алертах по логам?
        a: >-
          Правила не загрузились (не тот путь), запросы падают по таймауту, ruler не достучался до
          Alertmanager — алертов просто нет, и выглядит это как «всё спокойно». Поэтому за ruler смотрит
          Prometheus по его метрикам, а правила проверяются в CI на настоящих строках: одно событие
          часто пишется несколькими строками.
    lab: ['03-observability — «Логи: Loki и Alloy», «Логи: Fluent Bit вместо Alloy», «Алерты по логам: ruler Loki»']
    gdoc: ['Kubernetes: M20']
    seen: [runbooks/logs, runbooks/log-alerts]
    drill: ['k8s: observability', 'linux: logs']

  - id: 10
    title: 'Жизнь кластера: апгрейд, drain, отказ ноды'
    area: Кластер
    status: todo
    brief: >-
      Kubernetes выпускает минорную версию примерно раз в четыре месяца и поддерживает три последние,
      так что обновляться приходится постоянно. Главное правило апгрейда: компонент может отставать от
      apiserver, но не опережать его — поэтому сначала мастера, потом воркеры, по одной ноде через
      drain. Drain — плановая потеря ноды: поды выселяются вежливо, с оглядкой на PodDisruptionBudget.
      Внезапная смерть ноды — другое: Kubernetes несколько минут ждёт, что она вернётся, а StatefulSet
      без подтверждения смерти старого пода замену не создаёт вовсе.
    steps: [1-4, 1-5]
    read:
      - title: Upgrading kubeadm clusters
        url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
        note: >-
          Официальный порядок: первый мастер, остальные мастера, воркеры; что делают `upgrade apply` и
          `upgrade node`.
        lang: en
        min: 15
      - title: Disruptions
        url: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
        note: >-
          Плановые и внезапные потери подов и как PodDisruptionBudget ограничивает drain.
        lang: en
        min: 12
    questions:
      - q: В каком порядке обновляешь kubeadm-кластер и почему?
        a: >-
          Сначала все мастера, потом воркеры по одному, минорные версии без пропусков: компонент может
          отставать от apiserver, но не опережать его. На первом мастере `kubeadm upgrade apply`, на
          остальных `kubeadm upgrade node`, потом kubelet; каждую ноду — через drain и uncordon. У нас
          1.36 → 1.37 на пяти нодах заняло около 25 минут.
      - q: Что проверяешь перед апгрейдом?
        a: >-
          Свежий снимок etcd: после обновления последнего участника etcd переходит на новый протокол, и
          назад — только снимком. Что свои флаги лежат в `kubeadm-config`, а не только в манифестах, —
          иначе апгрейд их сотрёт; у нас это шифрование секретов. Плюс release notes на удалённые API и
          совместимость CNI.
      - q: drain завис. Почему?
        a: >-
          Чаще всего PDB: drain выселяет через Eviction API, и выселение, нарушающее бюджет, ждёт.
          Классика — `minAvailable: 1` при одной реплике: такой drain не пройдёт никогда. Ещё — под без
          контроллера (нужен `--force`), emptyDir или подам некуда уехать.
      - q: Нода внезапно умерла. Что происходит по времени?
        a: >-
          Через ~80 секунд нода `NotReady`, её поды теряют `Ready` и уходят из Service — трафик
          перестаёт идти. Ещё 5 минут поды числятся на мёртвой ноде, потом выселяются, и ReplicaSet
          создаёт замену. StatefulSet замену не создаёт: подтвердить смерть старого пода может только
          kubelet мёртвой ноды.
      - q: Почему поды на мёртвой ноде показывают `Running`?
        a: >-
          Статус пишет kubelet, а он мёртв — обновлять некому. Смотреть надо на условие `Ready` пода и
          статус ноды. По той же причине удаляемые поды там висят в Terminating бесконечно.
      - q: Нода не вернётся, а StatefulSet ждёт. Что делаешь?
        a: >-
          Сначала убеждаюсь, что машина правда мертва, а не отрезана сетью, — иначе получу два
          экземпляра пишущего приложения. Потом taint `out-of-service` или `delete pod --force`. С
          local-path это не поможет: данные физически на мёртвой ноде, переехал бы только сетевой диск.
      - q: Как ты знаешь, что апгрейд прошёл без простоя?
        a: >-
          Честно — не знаю: ошибки под нагрузкой не считали. И простой был: обе реплики CoreDNS стояли на
          одном мастере и выселились разом, а базы на local-path стояли, пока их нода была на drain.
          Чтобы утверждать «без простоя», нужен генератор нагрузки и счётчик ошибок на всё время апгрейда.
      - q: Что такое «кластер умер на Новый год»?
        a: >-
          Сертификаты kubeadm живут год. Если кластер год не обновляли, они истекают, и apiserver не
          пускает даже администратора. Лечится `kubeadm certs renew all` и рестартом control plane;
          каждый апгрейд перевыпускает их сам, но алерт на сроки всё равно нужен.
    lab: ['12-operations — «Обслуживание ноды: cordon, drain, PDB», «Отказ ноды: что происходит по времени», «Апгрейд 1.36 → 1.37», «Сертификаты»']
    gdoc: ['Kubernetes: M22 — только сверка с лабом']
    seen: [situations/pod-stuck-after-maintenance, situations/worker-down, runbooks/node-not-ready]
    drill: ['k8s: bootstrap']

  - id: 11
    title: 'CI на pull request: проверки, образ, сканер'
    area: Выкатка
    status: todo
    brief: >-
      CI — ворота перед `main`: каждый pull request сам проходит три проверки на машинах GitHub — линтер,
      тесты на настоящем Postgres и сборку образа с проверкой Trivy на известные уязвимости. Джобы идут
      параллельно, весь прогон — около 2.5 минут. Главное в воротах не то, что они зелёные, а то, что
      краснеют, когда должны: это проверено нарочно сломанным тестом и устаревшим Go. Образ сервиса —
      8.76 MB: многоступенчатая сборка, статический бинарь на distroless без оболочки.
    steps: [3-2]
    read:
      - title: Understanding GitHub Actions
        url: https://docs.github.com/en/actions/get-started/understand-github-actions
        note: >-
          Workflow, событие, job, step, runner, action — из чего собран любой пайплайн.
        lang: en
        min: 7
      - title: Docker — Multi-stage builds
        url: https://docs.docker.com/build/building/multi-stage/
        note: >-
          Собрать в одной стадии и взять в итоговый образ только бинарь — отсюда 8.76 MB вместо 1.9 GB.
        lang: en
        min: 8
    questions:
      - q: Как в GitHub Actions запустить тесты с базой?
        a: >-
          `services:` в джобе: контейнер Postgres поднимается до шагов и живёт до конца джобы.
          Обязательно healthcheck (`pg_isready`): без него шаги стартуют, пока база ещё
          инициализируется, и тесты падают через раз.
      - q: Почему actions пинят по SHA, а не по тегу?
        a: >-
          Тег в git — изменяемая ссылка: владелец или тот, кто украл его токен, может перевесить её на
          другой коммит — так было с trivy-action в марте 2026. SHA перевесить нельзя. Минус — сам не
          обновляется, поэтому Dependabot, и с паузой, чтобы не брать релиз в первые дни.
      - q: На что Trivy должен ронять PR?
        a: >-
          На HIGH и CRITICAL, для которых уже есть исправление. Ронять на всё подряд — ворота будут
          красными из-за того, что чинить нечем, и их выключат. Принятые риски — в `.trivyignore` с
          комментарием и сроком, а не снижением порога.
      - q: Как убедиться, что CI действительно что-то проверяет?
        a: >-
          Сломать нарочно и посмотреть, что краснеет ровно нужная джоба: тест, линтер, уязвимость. И
          следить за тихими пропусками: `--- SKIP` в тестах, `continue-on-error`, `|| true`. У нас тест без
          базы пропускался — в CI это сделали ошибкой.
      - q: Какие права у токена прогона и почему только чтение?
        a: >-
          `GITHUB_TOKEN` выдаётся на прогон с правами из настроек репо, бывает и запись. CI на PR ничего не
          пушит, поэтому `contents: read`: если в прогон попадёт вредоносная зависимость или action, писать
          в репо и пакеты она не сможет. Запись — только тем джобам, которым она нужна.
      - q: Как уменьшить образ Go и что такое distroless?
        a: >-
          Многоступенчатая сборка: компилируем в образе с Go, во вторую стадию берём только бинарь.
          `CGO_ENABLED=0` даёт статический бинарь, которому не нужна libc. Distroless — образ без оболочки
          и пакетного менеджера: у нас 1.9 GB → 8.76 MB. Минус — внутрь не зайти `exec sh`, отлаживать
          через `kubectl debug`.
      - q: Что Trivy находит в distroless-образе со статическим бинарём?
        a: >-
          Пакетов ОС там почти нет, зато Trivy читает из бинаря версии Go и всех модулей. Уязвимости
          стандартной библиотеки видны так же, как уязвимые пакеты: устаревший патч Go в стадии сборки
          дал 4 HIGH.
      - q: Как сделать проверки обязательными для merge?
        a: >-
          Branch protection или rulesets: обязательные проверки по именам джоб и запрет прямого пуша в
          `main`. На бесплатном аккаунте это только для открытых репо, поэтому у нас CI предупреждает, но
          кнопку Merge не блокирует. В компании с платным GitHub это одна галочка в настройках.
    lab: ['15-app-service — «CI на pull request»']
    gdoc: []
    seen: []
    drill: ['cicd: github-actions, pipeline-design, testing-in-ci, artifacts', 'docker: images, dockerfile, layers-cache, security']

  - id: 12
    title: 'Релиз и откат: миграции, expand/contract'
    area: Выкатка
    status: todo
    brief: >-
      Схему базы меняет не сервис при старте, а отдельный короткий Job: ArgoCD запускает его хуком PreSync
      перед каждой выкаткой. Job упал — выкатка встала, работает прежняя версия, а схема откатилась
      целиком, потому что миграции идут в транзакции. Ролей в базе две: мигратор владеет таблицами,
      сервис может только читать и писать данные. Главное правило — каждая миграция совместима с прошлой
      версией кода (expand/contract), поэтому откат — это старый образ на новой схеме, без отката базы.
    steps: [3-4]
    read:
      - title: Parallel Change — Martin Fowler
        url: https://martinfowler.com/bliki/ParallelChange.html
        note: >-
          Expand/contract в общем виде: добавить новое рядом со старым, переключиться, убрать старое. На
          этом держится откат без отката базы.
        lang: en
        min: 8
    questions:
      - q: Где запускать миграции в Kubernetes?
        a: >-
          Отдельным Job до обновления Deployment: хук PreSync в ArgoCD или pre-upgrade в Helm. Не при старте
          приложения: это права DDL у сервиса и миграция в каждом поде, а битая миграция кладёт все новые
          поды. Не initContainer: он выполняется при каждом рестарте пода, и реплики соревнуются за
          блокировку.
      - q: Что будет, если миграция упала?
        a: >-
          Job упал — синхронизация Failed, Deployment не обновляется, работает старая версия. Миграции в
          транзакции, схема откатилась целиком. ArgoCD несколько раз повторит синхронизацию, и пока он
          повторяет, исправление ждёт: у нас stage сошёлся через 10 минут, почти всё ушло на повторы.
      - q: Как откатить релиз, если он уже сделал миграцию?
        a: >-
          Не откатывать базу, а делать миграции совместимыми с прошлой версией кода: сначала добавить
          колонку, потом начать ею пользоваться, удалить — отдельным релизом. Тогда откат — старый образ на
          новой схеме. Проверено: после `ADD COLUMN done` prod откатили на версию без колонки — всё
          работает, Job ответил «новых миграций нет».
      - q: Почему не запускать down-миграции при откате?
        a: >-
          Down стирает то, что успела записать новая версия: `DROP COLUMN done` уносит все отметки. И сама
          down может упасть посреди инцидента. Down держим рабочими — тест Up → Down → Up в CI, — но
          запускаем только руками.
      - q: Как переименовать колонку без простоя?
        a: >-
          Тремя релизами: добавить новую колонку и писать в обе, перелить данные; переключить чтение на
          новую; убрать старую. Переименование одной миграцией сломает старые поды во время выкатки и
          сделает откат невозможным.
      - q: Зачем отдельная роль для миграций?
        a: >-
          Сервису в рантайме нужны только SELECT, INSERT, UPDATE и DELETE; права владельца — лишний риск
          при инъекции или ошибке в коде. Мигратор владеет таблицами и ходит только из Job. Нужны default
          privileges, иначе на таблицы, созданные позже, у сервиса не будет прав.
      - q: Почему CI не поймал битую миграцию?
        a: >-
          CI ловит несовместимость схемы с кодом: `NOT NULL` без DEFAULT упал на INSERT в тесте. Проблемы
          данных он не видит, тестовая база пустая: уникальный индекс при дублях прошёл CI и упал только
          на stage. Для этого и нужен stage с данными, похожими на prod.
      - q: Почему алерт на провал синхронизации мог промолчать?
        a: >-
          `increase()` считает прирост между точками ряда. Если ряда не было и он появился сразу с 1,
          прироста нет — 0, и первый в жизни провал у приложения не алертил. Лечение —
          `or (X unless X offset 10m)`, а для миграций — отдельный алерт на упавший Job: через минуту, а не
          через 16.
    lab: ['15-app-service — «Миграции отдельным шагом»', '08-databases — целиком']
    gdoc: ['Kubernetes: M5']
    seen: [runbooks/notes-migrations]
    drill: ['cicd: deployment-strategies']

  - id: 13
    title: 'Ресурсы, размещение, автомасштабирование'
    area: Приложения
    status: todo
    brief: >-
      Requests — сколько поду гарантировано: по ним планировщик раскладывает поды и от них HPA считает
      проценты. Limits — потолок: память сверх лимита — OOMKilled, CPU сверх лимита душится. HPA добавляет
      реплики, когда растёт метрика, PDB не даёт выселить больше одной реплики за раз, а
      topologySpreadConstraints разносит реплики по нодам. Главный вывод 3-5: HPA по CPU помогает, только
      когда упирается сам сервис; когда упирается база, новые реплики лишь добавят ей соединений.
    steps: [3-5]
    read:
      - title: Setting the right requests and limits in Kubernetes
        url: https://learnkube.com/setting-cpu-memory-limits-requests
        note: >-
          С картинками: как requests влияют на размещение, а лимиты — на троттлинг и OOM, и откуда
          берутся QoS-классы.
        lang: en
        min: 25
      - title: Horizontal Pod Autoscaling
        url: https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
        note: >-
          Как HPA считает число реплик от requests и зачем окно стабилизации. Хватит разделов про
          алгоритм и про стабилизацию.
        lang: en
        min: 12
    questions:
      - q: Чем requests отличаются от limits?
        a: >-
          По requests планировщик раскладывает поды, от них же HPA считает проценты; limits — потолок. CPU
          сверх лимита душится троттлингом, память сверх лимита — OOMKilled. От пары requests и limits
          зависит QoS-класс, а от него — порядок выселения при нехватке памяти на ноде.
      - q: Под в Pending с «Insufficient memory», а `kubectl top` показывает свободную память. Как так?
        a: >-
          Планировщик смотрит на сумму requests, а не на реальное потребление. У нас после апгрейда нода
          была занята на 98% по requests, и базы встали в Pending при свободной реальной памяти. Лечится
          честными requests по метрикам; уже запущенные поды сами не перебалансируются.
      - q: Почему лимит CPU часто не ставят?
        a: >-
          CPU сверх лимита не убивают, а душат квотой CFS: процесс ждёт следующего окна даже на свободной
          ноде, и это даёт хвосты задержек. Лимит памяти ставят обязательно, с запасом над пиком. У нас в
          покое 1–6m CPU при request 50m, под нагрузкой — до 337m без лимита, память — пик 24.5 MiB при
          лимите 128Mi.
      - q: По какой метрике настраивать HPA?
        a: >-
          По той, что растёт с нагрузкой и падает с репликами. CPU подходит, если сервис упирается в себя:
          на быстрых запросах HPA поднял реплики 2 → 4 за минуту. Если упирается база — CPU около нуля, и
          масштабировать бесполезно и даже вредно. Для очередей — длина очереди (KEDA).
      - q: Как HPA уживается с GitOps?
        a: >-
          Поля `replicas` в манифесте быть не должно: ArgoCD возвращал бы его поверх решения HPA. Поле
          удаляют, числом реплик владеет HPA. Можно и `ignoreDifferences` на `/spec/replicas`, но тогда
          поле в git вводит в заблуждение.
      - q: Почему HPA медленно убирает реплики?
        a: >-
          Окно стабилизации на уменьшение — 5 минут по умолчанию: HPA берёт максимум рекомендаций за окно,
          чтобы не дёргать реплики на пилообразной нагрузке. Вверх окна нет: 2 → 4 за минуту, а вниз —
          через 5 минут после конца нагрузки.
      - q: minAvailable или maxUnavailable в PDB?
        a: >-
          `maxUnavailable: 1`: не блокирует drain при одной реплике и держит N−1 при нескольких.
          `minAvailable: 1` при одной реплике запрещает выселение совсем — drain висит; это урок CoreDNS из
          1-5. С PDB drain посреди 1500 rps прошёл без единой ошибки.
      - q: Зачем topologySpreadConstraints и чем они ограничены?
        a: >-
          `maxSkew: 1` по hostname раскладывает реплики поровну по нодам, `ScheduleAnyway` — без Pending,
          если места не хватает. Ограничение: правило действует только при размещении пода. После drain и
          uncordon перекос остаётся, пока поды не пересоздадут, — переносом занимается descheduler.
      - q: Taint и nodeSelector — в чём разница?
        a: >-
          Taint на ноде — «сюда нельзя», toleration у пода — «мне можно». Toleration разрешает, но не
          требует: чтобы под поехал именно на эту ноду, нужен `nodeSelector` или `nodeAffinity`.
          `NoSchedule` не пускает новые поды, `NoExecute` ещё и выгоняет работающие.
    lab: ['04-workloads — «requests и limits», «HPA — автомасштабирование»', '11-objects-and-service-network — «Taints, tolerations и куда едут поды»']
    gdoc: ['Kubernetes: M13, M14, M15']
    seen: [runbooks/node-pressure, runbooks/node-resources, runbooks/workers-overcommit]
    drill: ['k8s: scheduling, placement, autoscaling']

  - id: 14
    title: Диагностика и поломки
    area: Кластер
    status: todo
    brief: >-
      Разбор начинается не с гипотез, а с вопроса к кластеру: `describe` и события почти всегда называют
      причину прямым текстом. `NotReady` у ноды значит не «поды умерли», а «кластер перестал слышать
      ноду», и причину видно только на самой ноде: машина, kubelet, runtime или часы. Многие поломки
      срабатывают не сразу: сломанный конфиг и уехавшие часы ждут следующего перезапуска. Дни поломок
      проверили сам мониторинг: три алерта пришли сами, о ноде с мониторингом написал внешний сторож, а
      забитый диск и упавший ingress не дали ни одного сообщения о главном.
    steps: [1-8, 2-5]
    read:
      - title: A visual guide on troubleshooting Kubernetes deployments
        url: https://learnkube.com/troubleshooting-deployments
        note: >-
          Блок-схема разбора снизу вверх: под → Service → Ingress, с командами на каждом шаге.
        lang: en
        min: 20
      - title: The USE Method — Brendan Gregg
        url: https://www.brendangregg.com/usemethod.html
        note: >-
          Для каждого ресурса ноды — загрузка, насыщение, ошибки. Хватит первой части страницы, до
          чеклистов по системам.
        lang: en
        min: 10
    questions:
      - q: С чего начинаешь, когда «что-то не работает» в кластере?
        a: >-
          Не гадаю, а спрашиваю кластер: `describe` проблемного объекта и события по времени.
          Планировщик, kubelet и контроллеры почти всегда пишут причину прямо —
          `0/3 nodes are available: 2 Insufficient memory` и есть ответ. Потом смотрю, что ещё рядом не
          в порядке.
      - q: Нода `NotReady`. Как понять, что именно случилось?
        a: >-
          Снаружи всё выглядит одинаково, поэтому иду на ноду. Машина не отвечает — умерла машина или
          сеть. Машина жива — `journalctl -u kubelet`: там будет OOM, диск, сертификат или x509 с
          «current time» из-за часов. kubelet жалуется на runtime — дальше containerd.
      - q: kubelet умер, а машина жива. Чем это опасно?
        a: >-
          Контейнеры продолжают работать — их держит containerd, а остановить некому. Через 5 минут
          кластер создаст замены на других нодах, и приложение окажется запущено дважды. Поэтому
          StatefulSet замену не создаёт, а перед принудительным удалением пода надо убедиться, что машина
          мертва.
      - q: Всё стало медленным, сыплются таймауты, ошибок нет. С чего начнёшь?
        a: >-
          Сравню из пода запрос по имени и по IP. Без CoreDNS запрос по имени висел у нас 4.8 с и падал,
          по IP — 25 мс. Дальше — эндпоинты `kube-dns`, поды и логи CoreDNS.
      - q: Поправил Corefile, DNS работает. Всё хорошо?
        a: >-
          Не факт. При ошибке в конфиге CoreDNS пишет `reload failed` и остаётся на старом, а ломается
          при следующем перезапуске: у нас после `rollout restart` новые поды ушли в CrashLoopBackOff.
          Поэтому после правки — логи на `reload failed`.
      - q: Что сломается, если на ноде уедут часы?
        a: >-
          Сразу почти ничего: нода осталась `Ready`. После рестарта kubelet — ошибка x509, и нода
          выглядит как мёртвая. А Prometheus и Loki приняли точки «из будущего» и потом отбрасывали всё
          новое. Следить — за смещением часов в node-exporter, лечить — chrony.
      - q: Диск на ноде забит, а алерта нет. Как так?
        a: >-
          kubelet при 10% свободного сам удаляет образы и выселяет поды, и место прыгает вверх-вниз.
          Правило «меньше 5% полчаса» недостижимо, а `for` сбрасывается на каждом скачке. Лечится своим
          правилом выше порога kubelet со сглаживанием `min_over_time`.
      - q: Сайт лёг вместе с ingress, а алерт на долю 5xx молчит. Почему?
        a: >-
          Он считает метрики ingress, а ingress умер — считать нечего. Алерты изнутри видят деградацию,
          но не полную смерть точки входа. Нужна проверка снаружи: blackbox exporter раз в 30 секунд
          открывает сайты через Cloudflare, `SiteDown` — через 2 минуты неудач.
    lab: ['06-troubleshooting — целиком', '12-operations — «Поломки ноды и DNS»', '03-observability — «Дни поломок»']
    gdoc: ['Kubernetes: M19, «Памятка-оси» п. 7–8', 'Сети: M18, справочник части 2–3']
    seen: [situations/node-unreachable, situations/disk-full, situations/dns-slow, situations/site-down, runbooks/triage, runbooks/disk]
    drill: ['k8s: troubleshooting', 'сети: diagnostics', 'linux: systemd, logs, performance']

  - id: 15
    title: 'Конфиг, секреты, хранилище'
    area: Приложения
    status: todo
    brief: >-
      Под живёт недолго, а данным и настройкам нужно жить дольше. Конфиг приходит в под из ConfigMap,
      пароли — из Secret: переменными окружения или файлами. Данные — на томах: под просит место через
      PVC, а StorageClass и провижинер выдают PV. На голом kubeadm провижинера нет, в лабе стоит
      local-path — том на диске конкретной ноды, и под с ним больше никуда не уедет. Поэтому StatefulSet с
      томом — ещё не база: репликации, переключения и бэкапа он не даёт.
    steps: []
    read:
      - title: Persistent Volumes
        url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
        note: >-
          PV, PVC, StorageClass, режимы доступа и политика возврата. Хватит первых разделов, до «Types of
          Persistent Volumes».
        lang: en
        min: 15
      - title: ConfigMaps
        url: https://kubernetes.io/docs/concepts/configuration/configmap/
        note: >-
          Как конфиг попадает в под — переменными или файлами — и что из этого обновляется на лету.
        lang: en
        min: 10
      - title: Good practices for Kubernetes Secrets
        url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
        note: >-
          Что делать с Secret: шифрование в etcd, минимум прав на чтение, внешние хранилища.
        lang: en
        min: 6
    questions:
      - q: Создал PVC на свежем kubeadm-кластере, а он висит в Pending. Почему?
        a: >-
          Томы некому выдавать: в облачном кластере это делает CSI-драйвер провайдера, а на голом kubeadm
          его нет. Нужен провижинер — у нас local-path — и StorageClass по умолчанию. Ещё вариант — режим
          `WaitForFirstConsumer`: PVC ждёт, пока появится под, и это норма.
      - q: Зачем `WaitForFirstConsumer`?
        a: >-
          Том создаётся только после того, как планировщик выбрал ноду для пода. С `Immediate` локальный
          том мог бы появиться на одной ноде, а под уехать на другую и застрять навсегда. Для любого
          хранилища, привязанного к месту, — локальных или зональных дисков — это правильный режим.
      - q: Чем опасен local-path для баз и мониторинга?
        a: >-
          Такой том привязан к ноде: под с ним больше никуда не уедет. На отказе ноды Prometheus,
          Alertmanager и Loki просто ждали, пока она вернётся, и мониторинг лёг целиком. Для прода —
          сетевое хранилище или репликация на уровне самого приложения.
      - q: Что значит ReadWriteOnce?
        a: >-
          Том монтируется на чтение и запись на одну **ноду**, а не на один под: два пода на одной ноде
          смонтируют его оба. Нужен строго один под — `ReadWriteOncePod`. Для баз это важно: два процесса
          Postgres на одних файлах — порча данных.
      - q: У тебя StatefulSet с PVC — бэкап есть?
        a: >-
          Нет. PVC — данные на диске одной ноды, а не копия. Бэкап — копия в другом месте с проверенным
          восстановлением: минимум `pg_dump` по CronJob в объектное хранилище, по-хорошему — физический
          бэкап с архивом WAL. Бэкап, из которого ни разу не восстанавливались, бэкапом не считается.
      - q: Конфиг в ConfigMap поменяли, а приложение работает по-старому. Почему?
        a: >-
          Переменные окружения читаются только при старте контейнера — нужен рестарт пода. Файл из тома
          kubelet обновит сам через какое-то время, но только без `subPath`: файл, смонтированный через
          `subPath`, не обновляется никогда. И даже свежий файл приложение должно перечитать само.
      - q: Чем Secret отличается от ConfigMap, кроме названия?
        a: >-
          Устроены почти одинаково, но Secret можно отдельно зашифровать в etcd, на ноде kubelet держит его
          в памяти (tmpfs), а не на диске, и права на чтение секретов выдают отдельно. При этом base64 — не
          шифрование: кто может читать секреты в namespace — например, роль `edit`, — тот видит пароли.
      - q: Масштабировал Postgres до двух реплик — почему репликации нет?
        a: >-
          StatefulSet даёт второму поду имя и пустой том, но ничего не знает о Postgres: кто primary, как
          гнать WAL, как переключаться. Это задача приложения или оператора — CloudNativePG, Patroni.
          Голый `scale` даёт две независимые пустые базы.
