    practice_check: >-
      Сначала проверь чтение файла и ошибки доставки Fluent Bit. Затем найди строку в Loki с
      правильными метками и окном. Если запрос в Loki видит строку, проверь вычисление правила
      ruler и доставку в Alertmanager. Для каждого перехода нужен самостоятельный сигнал.
    title: 'Логи: Fluent Bit, Loki, алерты по логам'
    area: Наблюдаемость
    status: todo
    brief: >-
      Fluent Bit на каждой ноде читает файлы логов подов, как `tail -f`, помнит, докуда дочитал, и
      приклеивает к строке «адрес»: неймспейс, приложение, контейнер, нода. Loki индексирует только этот
      адрес — метки, а сам текст хранит сжатыми кусками и при поиске читает их подряд. Поэтому меток мало:
      каждая новая комбинация — отдельный поток. Алерты по логам считает ruler Loki и шлёт в тот же
      Alertmanager. Главный урок: пайплайн логов ломается молча, поэтому за сборщиком, Loki и ruler
      смотрит Prometheus.
    steps: [2-8, 2-9]
    step_focus:
      2-8: >-
        Сверь, какие поля оставили метками Loki, что вынесли в metadata и чем подтвердили
        отсутствие отбросов.
      2-9: >-
        Проследи один алерт от правила Loki до Telegram и назови отдельную проверку здоровья
        ruler.
    read:
      - title: Loki overview
        url: https://github.com/grafana/loki/blob/main/docs/sources/get-started/overview.md
        note: >-
          Индекс только по меткам, текст — сжатыми кусками, отсюда правило «меток мало». Это страница
          документации в репо Loki: grafana.com из РБ без VPN отдаёт 451.
        lang: en
        min: 9
      - title: Fluent Bit — Key concepts
        url: https://docs.fluentbit.io/manual/concepts/key-concepts
        note: >-
          Событие, тег, запись и маршрутизация по тегам — из чего собран пайплайн Fluent Bit.
        lang: en
        min: 5
    questions:
      - q: Разбирать JSON-логи в сборщике или при запросе?
        a: >-
          Зависит от хранилища. Elasticsearch индексирует поля — там разбирают при записи. Loki
          индексирует только метки, поэтому строка хранится как есть, а `| json` — в запросе. Поля в
          метках — верный способ убить Loki числом потоков.
      - q: Как Fluent Bit не теряет строки, если Loki лежит?
        a: >-
          Fluent Bit сохраняет позицию чтения и буферизует неотправленные строки на диске.
          Предел у буфера конечный: при долгом отказе старые порции могут быть отброшены. Следи
          за ошибками доставки и лимитом очереди.
      - q: Что может молча сломаться в алертах по логам?
        a: >-
          Правила не загрузились (не тот путь), запросы падают по таймауту, ruler не достучался до
          Alertmanager — алертов просто нет, и выглядит это как «всё спокойно». Поэтому за ruler смотрит
          Prometheus по его метрикам, а правила проверяются в CI на настоящих строках: одно событие
          часто пишется несколькими строками.
      - q: Почему Loki дешевле Elasticsearch и где подвох?
        a: >-
          Loki индексирует только метки, а текст хранит сжатыми кусками и при поиске читает подряд.
          Подвох — меток должно быть мало: метка с request_id или именем пода плодит потоки и убивает
          установку. У нас метки namespace, app, container и node, а pod лежит в structured metadata.
      - q: Retention в Loki выставлен, а логи не удаляются. Почему?
        a: >-
          Удаляет compactor, и только с `retention_enabled: true`. Без этого `retention_period` — просто
          цифра в конфиге. У нас так было с первого дня: лежали логи двухнедельной давности.
      - q: Loki отбрасывает строки с `too_far_behind`. Что это?
        a: >-
          Строка старше последней, уже принятой в этом потоке. Часы на ноде когда-то убегали на два года
          вперёд, Loki принял строки «из 2028-го» и потом неделю выбрасывал все нормальные строки этих
          потоков — около 23%. Видно по `loki_discarded_samples_total`, но метрик Loki в Prometheus
          тогда не было.
      - q: Когда алерт по логам, а когда по метрикам?
        a: >-
          По метрикам всё, что можно: дешевле и не ломается от смены формата лога. По логам — когда
          метрики нет или смысл только в тексте: почему не скачивается образ (401 и «тег удалён» лечатся
          по-разному), неудачные входы в ArgoCD и Grafana.
    lab: ['03-observability — «Логи: Loki и Alloy», «Логи: Fluent Bit вместо Alloy», «Алерты по логам: ruler Loki»']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M20 «Наблюдаемость в кластере» · «Что важно знать»:
        централизация логов и Loki. Настройку ruler смотри в итоге 2-9.
    seen: [runbooks/logs, runbooks/log-alerts]
    drill: ['k8s: observability', 'linux: logs']

  - id: 10
    practice: >-
      Сравни `drain` исправной ноды и внезапный отказ. Назови, где действует PDB, что случится
      с томом local-path и какой пользовательский сигнал нужен, чтобы судить о простое.
    practice_check: >-
      При drain API выселения учитывает PDB, при потере ноды PDB сам отказ не предотвращает. У
      local-path данные остаются на диске исходной ноды. О простое суди по запросам клиента во
      время события. На `1-4` были проверки компонентов, замера запросов для утверждения «без
      простоя» не было.
    title: 'Жизнь кластера: апгрейд, drain, отказ ноды'
    area: Кластер
    status: todo
    brief: >-
      Kubernetes выпускает минорную версию примерно раз в четыре месяца и поддерживает три последние,
      так что обновляться приходится постоянно. Главное правило апгрейда: компонент может отставать от
      apiserver, но не опережать его — поэтому сначала мастера, потом воркеры, по одной ноде через
      drain. Drain — плановая потеря ноды: поды выселяются вежливо, с оглядкой на PodDisruptionBudget.
      Внезапная смерть ноды — другое: Kubernetes несколько минут ждёт, что она вернётся, а StatefulSet
      без подтверждения смерти старого пода замену не создаёт вовсе.
    steps: [1-4, 1-5]
    step_focus:
      1-4: >-
        Открой фактический порядок апгрейда и различи проверки компонентов и замер
        пользовательского простоя.
      1-5: >-
        Сверь две истории: добровольное выселение CoreDNS и потерю ноды с данными local-path.
    read:
      - title: Upgrading kubeadm clusters
        url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
        note: >-
          Официальный порядок: первый мастер, остальные мастера, воркеры; что делают `upgrade apply` и
          `upgrade node`.
        lang: en
        min: 15
      - title: Disruptions
        url: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
        note: >-
          Плановые и внезапные потери подов и как PodDisruptionBudget ограничивает drain.
        lang: en
        min: 12
    questions:
      - q: В каком порядке обновляешь kubeadm-кластер и почему?
        a: >-
          При минорном обновлении kubeadm сначала обновляй control plane, затем воркеры. Порядок
          команд зависит от роли узла и правил version skew для конкретных компонентов. На `1-4`
          переход с 1.36 на 1.37 занял около 25 минут на пяти нодах.
      - q: Что проверяешь перед апгрейдом?
        a: >-
          Подготовь снимок etcd и материалы для восстановления, включая ключ шифрования, если он
          используется. Сверь version skew, совместимость CNI и удаляемые API. Проверь, что
          нужные флаги сохранены в конфигурации kubeadm и переживут генерацию манифестов.
      - q: drain завис. Почему?
        a: >-
          Чаще всего PDB: drain выселяет через Eviction API, и выселение, нарушающее бюджет, ждёт.
          Классика — `minAvailable: 1` при одной реплике: такой drain не пройдёт никогда. Ещё — под без
          контроллера (нужен `--force`), emptyDir или подам некуда уехать.
      - q: Нода внезапно умерла. Что происходит по времени?
        a: >-
          Через ~80 секунд нода `NotReady`, её поды теряют `Ready` и уходят из Service — трафик
          перестаёт идти. Ещё 5 минут поды числятся на мёртвой ноде, потом выселяются, и ReplicaSet
          создаёт замену. StatefulSet замену не создаёт: подтвердить смерть старого пода может только
          kubelet мёртвой ноды.
      - q: Почему поды на мёртвой ноде показывают `Running`?
        a: >-
          Статус пишет kubelet, а он мёртв — обновлять некому. Смотреть надо на условие `Ready` пода и
          статус ноды. По той же причине удаляемые поды там висят в Terminating бесконечно.
      - q: Нода не вернётся, а StatefulSet ждёт. Что делаешь?
        a: >-
          Сначала убеждаюсь, что машина правда мертва, а не отрезана сетью, — иначе получу два
          экземпляра пишущего приложения. Потом taint `out-of-service` или `delete pod --force`. С
          local-path это не поможет: данные физически на мёртвой ноде, переехал бы только сетевой диск.
      - q: Как ты знаешь, что апгрейд прошёл без простоя?
        a: >-
          Честно — не знаю: ошибки под нагрузкой не считали. И простой был: обе реплики CoreDNS стояли на
          одном мастере и выселились разом, а базы на local-path стояли, пока их нода была на drain.
          Чтобы утверждать «без простоя», нужен генератор нагрузки и счётчик ошибок на всё время апгрейда.
      - q: Что такое «кластер умер на Новый год»?
        a: >-
          Сертификаты kubeadm живут год. Если кластер год не обновляли, они истекают, и apiserver не
          пускает даже администратора. Лечится `kubeadm certs renew all` и рестартом control plane;
          каждый апгрейд перевыпускает их сам, но алерт на сроки всё равно нужен.
    lab: ['12-operations — «Обслуживание ноды: cordon, drain, PDB», «Отказ ноды: что происходит по времени», «Апгрейд 1.36 → 1.37», «Сертификаты»']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M22 «Как кластер поднимается по-настоящему» · «Что важно
        знать»: как kubeadm обновляет control plane и узлы.
    seen: [situations/pod-stuck-after-maintenance, situations/worker-down, runbooks/node-not-ready]
    drill: ['k8s: bootstrap']

  - id: 11
    practice: >-
      Спроектируй проверку PR для `notes` с Postgres. Назови по одной намеренной ошибке, на
      которой должны упасть тесты и сканирование образа, и покажи, как по логу понять, что
      упала нужная проверка.
    practice_check: >-
      Пусть тест меняет ожидаемый статус API и падает с понятным сообщением. Для проверки Trivy
      сравни два локально собранных образа: отчёт на старом патче Go показал четыре HIGH. В
      каждом случае назови конкретную джобу. На `3-2` CI подсвечивал ошибку, обязательный merge
      gate не включали.
    title: 'CI на pull request: проверки, образ, сканер'
    area: Выкатка
    status: todo
    brief: >-
      На pull request CI запускает три проверки на машинах GitHub: линтер,
      тесты на настоящем Postgres и сборку образа с проверкой Trivy на известные уязвимости. Джобы идут
      параллельно, весь прогон — около 2.5 минут. Обязательность проверок при merge в лабе не включена. Нарочно сломанный тест и сборка на старом
      Go подтвердили, что CI замечает ошибки. Образ сервиса —
      8.76 MB: многоступенчатая сборка, статический бинарь на distroless без оболочки.
    steps: [3-2]
    step_focus:
      3-2: >-
        Сверь две проверки с намеренным сбоем: сломанный тест и сборку на старом Go. Проверь,
        блокирует ли CI merge в лабе.
    read:
      - title: Understanding GitHub Actions
        url: https://docs.github.com/en/actions/get-started/understand-github-actions
        note: >-
          Workflow, событие, job, step, runner, action — из чего собран любой пайплайн.
        lang: en
        min: 7
      - title: Docker — Multi-stage builds
        url: https://docs.docker.com/build/building/multi-stage/
        note: >-
          Собрать в одной стадии и взять в итоговый образ только бинарь — отсюда 8.76 MB вместо 1.9 GB.
        lang: en
        min: 8
    questions:
      - q: Как в GitHub Actions запустить тесты с базой?
        a: >-
          `services:` в джобе: контейнер Postgres поднимается до шагов и живёт до конца джобы.
          Обязательно healthcheck (`pg_isready`): без него шаги стартуют, пока база ещё
          инициализируется, и тесты падают через раз.
      - q: На что Trivy должен ронять PR?
        a: >-
          На HIGH и CRITICAL, для которых уже есть исправление. Ронять на всё подряд — ворота будут
          красными из-за того, что чинить нечем, и их выключат. Принятые риски — в `.trivyignore` с
          комментарием и сроком, а не снижением порога.
      - q: Как убедиться, что CI действительно что-то проверяет?
        a: >-
          Сломать нарочно и посмотреть, что краснеет ровно нужная джоба: тест, линтер, уязвимость. И
          следить за тихими пропусками: `--- SKIP` в тестах, `continue-on-error`, `|| true`. У нас тест без
          базы пропускался — в CI это сделали ошибкой.
      - q: Почему actions пинят по SHA, а не по тегу?
        a: >-
          Тег в git — изменяемая ссылка: владелец или тот, кто украл его токен, может перевесить её на
          другой коммит — так было с trivy-action в марте 2026. SHA перевесить нельзя. Минус — сам не
          обновляется, поэтому Dependabot, и с паузой, чтобы не брать релиз в первые дни.
      - q: Какие права у токена прогона и почему только чтение?
        a: >-
          `GITHUB_TOKEN` выдаётся на прогон с правами из настроек репо, бывает и запись. CI на PR ничего не
          пушит, поэтому `contents: read`: если в прогон попадёт вредоносная зависимость или action, писать
          в репо и пакеты она не сможет. Запись — только тем джобам, которым она нужна.
      - q: Как уменьшить образ Go и что такое distroless?
        a: >-
          Многоступенчатая сборка: компилируем в образе с Go, во вторую стадию берём только бинарь.
          `CGO_ENABLED=0` даёт статический бинарь, которому не нужна libc. Distroless — образ без оболочки
          и пакетного менеджера: у нас 1.9 GB → 8.76 MB. Минус — внутрь не зайти `exec sh`, отлаживать
          через `kubectl debug`.
      - q: Что Trivy находит в distroless-образе со статическим бинарём?
        a: >-
          Пакетов ОС там почти нет, зато Trivy читает из бинаря версии Go и всех модулей. Уязвимости
          стандартной библиотеки видны так же, как уязвимые пакеты: устаревший патч Go в стадии сборки
          дал 4 HIGH.
      - q: Как сделать проверки обязательными для merge?
        a: >-
          Branch protection или rulesets: обязательные проверки по именам джоб и запрет прямого пуша в
          `main`. В приватном репозитории лаба на `3-2` эти проверки были видны в PR, а блокировка Merge
          для них не была включена.
    lab: ['15-app-service — «CI на pull request»']
    gdoc: []
    seen: []
    drill: ['cicd: github-actions, pipeline-design, testing-in-ci, artifacts', 'docker: images, dockerfile, layers-cache, security']

  - id: 12
    practice: >-
      Представь, что релиз добавил колонку и новый API даёт ошибки. Восстанови порядок Job
      PreSync, выкатки и возврата образа. Назови проверку совместимости и момент, после
      которого старый образ откатывать опасно.
    practice_check: >-
      PreSync Job сначала добавляет совместимую схему. Если Job падает, ArgoCD не выкатывает
      новую версию. Когда ломается уже запущенный API, возвращают совместимый образ, сохраняя
      схему. После удаления поля, которое читает старая версия, совместимость нужно
      пересмотреть.
    title: 'Релиз и откат: миграции, expand/contract'
    area: Выкатка
    status: todo
    brief: >-
      Схему базы меняет не сервис при старте, а отдельный короткий Job: ArgoCD запускает его хуком PreSync
      при выкатке. Если Job падает, ArgoCD останавливает выкатку. В лабе транзакция
      упавшей миграции откатилась, прежняя версия осталась запущенной. Ролей в базе две: мигратор владеет таблицами,
      сервис может только читать и писать данные. Главное правило — каждая миграция совместима с прошлой
      версией кода (expand/contract), поэтому откат — это старый образ на новой схеме, без отката базы.
    steps: [3-4]
    step_focus:
      3-4: >-
        Найди проверку отката на новой схеме и нижнюю границу версии, до которой он безопасен.
    read:
      - title: Parallel Change — Martin Fowler
        url: https://martinfowler.com/bliki/ParallelChange.html
        note: >-
          Expand/contract в общем виде: добавить новое рядом со старым, переключиться, убрать старое. На
          этом держится откат без отката базы.
        lang: en
        min: 8
    questions:
      - q: Где запускать миграции в Kubernetes?
        a: >-
          Отдельным Job до обновления Deployment: хук PreSync в ArgoCD или pre-upgrade в Helm. Не при старте
          приложения: это права DDL у сервиса и миграция в каждом поде, а битая миграция кладёт все новые
          поды. Не initContainer: он выполняется при каждом рестарте пода, и реплики соревнуются за
          блокировку.
      - q: Что будет, если миграция упала?
        a: >-
          Если PreSync Job завершился ошибкой, новая версия Deployment ждёт успешной
          синхронизации. В проверенном сценарии изменения упавшей миграции откатила её
          транзакция. Если прежде в том же запуске успешно прошли другие миграции, их изменения
          могут сохраниться.
      - q: Как откатить релиз, если он уже сделал миграцию?
        a: >-
          Не откатывать базу, а делать миграции совместимыми с прошлой версией кода: сначала добавить
          колонку, потом начать ею пользоваться, удалить — отдельным релизом. Тогда откат — старый образ на
          новой схеме. Проверено: после `ADD COLUMN done` prod откатили на версию без колонки — всё
          работает, Job ответил «новых миграций нет».
      - q: Почему не запускать down-миграции при откате?
        a: >-
          Down стирает то, что успела записать новая версия: `DROP COLUMN done` уносит все отметки. И сама
          down может упасть посреди инцидента. Down держим рабочими — тест Up → Down → Up в CI, — но
          запускаем только руками.
      - q: Как переименовать колонку без простоя?
        a: >-
          Тремя релизами: добавить новую колонку и писать в обе, перелить данные; переключить чтение на
          новую; убрать старую. Переименование одной миграцией сломает старые поды во время выкатки и
          сделает откат невозможным.
      - q: Зачем отдельная роль для миграций?
        a: >-
          Сервису в рантайме нужны только SELECT, INSERT, UPDATE и DELETE; права владельца — лишний риск
          при инъекции или ошибке в коде. Мигратор владеет таблицами и ходит только из Job. Нужны default
          privileges, иначе на таблицы, созданные позже, у сервиса не будет прав.
      - q: Почему CI не поймал битую миграцию?
        a: >-
          CI ловит несовместимость схемы с кодом: `NOT NULL` без DEFAULT упал на INSERT в тесте. Проблемы
          данных он не видит, тестовая база пустая: уникальный индекс при дублях прошёл CI и упал только
          на stage. Для этого и нужен stage с данными, похожими на prod.
      - q: Почему алерт на провал синхронизации мог промолчать?
        a: >-
          `increase()` считает прирост между точками ряда. Если ряда не было и он появился сразу с 1,
          прироста нет — 0, и первый в жизни провал у приложения не алертил. Лечение —
          `or (X unless X offset 10m)`, а для миграций — отдельный алерт на упавший Job: через минуту, а не
          через 16.
    lab: ['15-app-service — «Миграции отдельным шагом»', '08-databases — целиком']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M5 «Контроллеры рабочих нагрузок» · «Что важно знать»: чем
        Job отличается от Deployment. PreSync и совместимость схемы смотри в итоге 3-4.
    seen: [runbooks/notes-migrations]
    drill: ['cicd: deployment-strategies']

  - id: 13
    practice: >-
      Разбери два прогона `3-5`: CPU у `notes` низкий при перегруженном Postgres, а на быстрых
      запросах HPA растит реплики. Объясни оба результата и роль PDB при последующем drain.
    practice_check: >-
      Медленный поиск нагружал Postgres, у `notes` CPU оставался низким. На быстрых запросах CPU
      сервиса вырос и HPA поднял 2 → 4 реплики примерно за минуту. PDB ограничил добровольные
      выселения при drain. После uncordon уже размещённые поды сами не перераспределились.
    title: 'Ресурсы, размещение, автомасштабирование'
    area: Приложения
    status: todo
    brief: >-
      Requests — заявка на ресурсы для планировщика. HPA может сравнивать потребление CPU с этой заявкой. Limits — потолок: память сверх лимита — OOMKilled, CPU сверх лимита душится. HPA добавляет
      реплики, когда растёт метрика, PDB у `notes` ограничивает добровольные выселения, а
      topologySpreadConstraints помогают распределить новые поды по нодам. Главный вывод 3-5: HPA по CPU помогает, только
      когда упирается сам сервис; когда упирается база, новые реплики лишь добавят ей соединений.
    steps: [3-5]
    step_focus:
      3-5: >-
        Открой таблицу результатов: сравни два профиля нагрузки, рост HPA 2 → 4 и drain под
        нагрузкой.
    read:
      - title: Setting the right requests and limits in Kubernetes
        url: https://learnkube.com/setting-cpu-memory-limits-requests
        note: >-
          Посмотри примеры про размещение, троттлинг и OOM. Их хватит, чтобы сравнить requests и limits.
        lang: en
        min: 12
      - title: Horizontal Pod Autoscaling
        url: https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
        note: >-
          Как HPA считает число реплик от requests и зачем окно стабилизации. Хватит разделов про
          алгоритм и про стабилизацию.
        lang: en
        min: 12
    questions:
      - q: Чем requests отличаются от limits?
        a: >-
          По requests планировщик раскладывает поды, от них же HPA считает проценты; limits — потолок. CPU
          сверх лимита душится троттлингом, память сверх лимита — OOMKilled. От пары requests и limits
          зависит QoS-класс, а от него — порядок выселения при нехватке памяти на ноде.
      - q: По какой метрике настраивать HPA?
        a: >-
          По той, что растёт с нагрузкой и падает с репликами. CPU подходит, если сервис упирается в себя:
          на быстрых запросах HPA поднял реплики 2 → 4 за минуту. Если упирается база — CPU около нуля, и
          масштабировать бесполезно и даже вредно. Для очередей — длина очереди (KEDA).
      - q: minAvailable или maxUnavailable в PDB?
        a: >-
          `maxUnavailable: 1` допускает потерю единственной реплики при добровольном выселении.
          `minAvailable: 1` защищает единственную здоровую реплику, пока её не заменит другая.
          На `3-5` drain проверили с несколькими репликами `notes`: 0 ошибок при 1500 запросах/с.
      - q: Под в Pending с «Insufficient memory», а `kubectl top` показывает свободную память. Как так?
        a: >-
          Планировщик смотрит на сумму requests, а не на реальное потребление. У нас после апгрейда нода
          была занята на 98% по requests, и базы встали в Pending при свободной реальной памяти. Лечится
          честными requests по метрикам; уже запущенные поды сами не перебалансируются.
      - q: Почему лимит CPU часто не ставят?
        a: >-
          CPU сверх лимита не убивают, а душат квотой CFS: процесс ждёт следующего окна даже на свободной
          ноде, и это даёт хвосты задержек. Лимит памяти ставят обязательно, с запасом над пиком. У нас в
          покое 1–6m CPU при request 50m, под нагрузкой — до 337m без лимита, память — пик 24.5 MiB при
          лимите 128Mi.
      - q: Как HPA уживается с GitOps?
        a: >-
          Поля `replicas` в манифесте быть не должно: ArgoCD возвращал бы его поверх решения HPA. Поле
          удаляют, числом реплик владеет HPA. Можно и `ignoreDifferences` на `/spec/replicas`, но тогда
          поле в git вводит в заблуждение.
      - q: Почему HPA медленно убирает реплики?
        a: >-
          Окно стабилизации на уменьшение — 5 минут по умолчанию: HPA берёт максимум рекомендаций за окно,
          чтобы не дёргать реплики на пилообразной нагрузке. Вверх окна нет: 2 → 4 за минуту, а вниз —
          через 5 минут после конца нагрузки.
      - q: Зачем topologySpreadConstraints и чем они ограничены?
        a: >-
          `maxSkew: 1` по hostname раскладывает реплики поровну по нодам, `ScheduleAnyway` — без Pending,
          если места не хватает. Ограничение: правило действует только при размещении пода. После drain и
          uncordon перекос остаётся, пока поды не пересоздадут, — переносом занимается descheduler.
      - q: Taint и nodeSelector — в чём разница?
        a: >-
          Taint на ноде — «сюда нельзя», toleration у пода — «мне можно». Toleration разрешает, но не
          требует: чтобы под поехал именно на эту ноду, нужен `nodeSelector` или `nodeAffinity`.
          `NoSchedule` не пускает новые поды, `NoExecute` ещё и выгоняет работающие.
    lab: ['04-workloads — «requests и limits», «HPA — автомасштабирование»', '11-objects-and-service-network — «Taints, tolerations и куда едут поды»']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M13 «Scheduler, requests/limits, QoS» · «Ситуации»: выбор
        ноды, троттлинг и OOM.
      - >-
        Kubernetes (k8s-cheatsheet), M14 «Управление размещением подов» · «Ситуации»: topology
        spread и Pending.
      - >-
        Kubernetes (k8s-cheatsheet), M15 «Автоскейлинг» · «Ситуации»: формула HPA и роль
        requests.
    seen: [runbooks/node-pressure, runbooks/node-resources, runbooks/workers-overcommit]
    drill: ['k8s: scheduling, placement, autoscaling']

  - id: 14
    practice: >-
      Возьми один симптом из `1-8` или `2-5`. За две минуты назови первое наблюдение, две
      гипотезы, проверку, которая их различает, и сигнал восстановления. Сверь
      последовательность с итогом шага.
    practice_check: >-
      Пример из `1-8`: по имени запрос висел, по IP проходил. Эти две проверки разделили сбой
      DNS и отказ приложения. После восстановления CoreDNS повторили запрос по имени. Для
      другого сценария держи тот же порядок: свидетельство → различающая проверка → повтор
      исходного запроса.
    title: Диагностика и поломки
    area: Кластер
    status: todo
    brief: >-
      Сначала уточни симптом и масштаб. `NotReady` показывает, что нода не готова обслуживать
      нагрузку, а `Unknown` часто означает потерю связи с kubelet. События, состояние VM и
      логи kubelet помогают сузить причину. На `2-5` падение ingress убрало сами ряды, по
      которым считали долю 5xx. Проверку доступности сайта добавили отдельно.
    steps: [1-8, 2-5]
    step_focus:
      1-8: >-
        Возьми один эпизод: DNS, остановка kubelet или часы. Сверь симптом, ложную гипотезу и
        подтверждение причины.
      2-5: >-
        Возьми один эпизод, где сигнал пропал. Раздели отказ приложения, исчезновение метрик и
        потерю мониторинга.
    read:
      - title: A visual guide on troubleshooting Kubernetes deployments
        url: https://learnkube.com/troubleshooting-deployments
        note: >-
          Начни с блок-схемы под → Service → Ingress. Выбери одну развилку по симптому из упражнения.
        lang: en
        min: 10
      - title: The USE Method — Brendan Gregg
        url: https://www.brendangregg.com/usemethod.html
        note: >-
          Для каждого ресурса ноды — загрузка, насыщение, ошибки. Хватит первой части страницы, до
          чеклистов по системам.
        lang: en
        min: 10
    questions:
      - q: С чего начинаешь, когда «что-то не работает» в кластере?
        a: >-
          Не гадаю, а спрашиваю кластер: `describe` проблемного объекта и события по времени.
          Планировщик, kubelet и контроллеры почти всегда пишут причину прямо —
          `0/3 nodes are available: 2 Insufficient memory` и есть ответ. Потом смотрю, что ещё рядом не
          в порядке.
      - q: Нода `NotReady`. Как понять, что именно случилось?
        a: >-
          Снаружи всё выглядит одинаково, поэтому иду на ноду. Машина не отвечает — умерла машина или
          сеть. Машина жива — `journalctl -u kubelet`: там будет OOM, диск, сертификат или x509 с
          «current time» из-за часов. kubelet жалуется на runtime — дальше containerd.
      - q: kubelet умер, а машина жива. Чем это опасно?
        a: >-
          Контейнеры продолжают работать — их держит containerd, а остановить некому. Через 5 минут
          кластер создаст замены на других нодах, и приложение окажется запущено дважды. Поэтому
          StatefulSet замену не создаёт, а перед принудительным удалением пода надо убедиться, что машина
          мертва.
      - q: Всё стало медленным, сыплются таймауты, ошибок нет. С чего начнёшь?
        a: >-
          Сравню из пода запрос по имени и по IP. Без CoreDNS запрос по имени висел у нас 4.8 с и падал,
          по IP — 25 мс. Дальше — эндпоинты `kube-dns`, поды и логи CoreDNS.
      - q: Поправил Corefile, DNS работает. Всё хорошо?
        a: >-
          Не факт. При ошибке в конфиге CoreDNS пишет `reload failed` и остаётся на старом, а ломается
          при следующем перезапуске: у нас после `rollout restart` новые поды ушли в CrashLoopBackOff.
          Поэтому после правки — логи на `reload failed`.
      - q: Что сломается, если на ноде уедут часы?
        a: >-
          Сразу почти ничего: нода осталась `Ready`. После рестарта kubelet — ошибка x509, и нода
          выглядит как мёртвая. А Prometheus и Loki приняли точки «из будущего» и потом отбрасывали всё
          новое. Следить — за смещением часов в node-exporter, лечить — chrony.
      - q: Диск на ноде забит, а алерта нет. Как так?
        a: >-
          kubelet при 10% свободного сам удаляет образы и выселяет поды, и место прыгает вверх-вниз.
          Правило «меньше 5% полчаса» недостижимо, а `for` сбрасывается на каждом скачке. Лечится своим
          правилом выше порога kubelet со сглаживанием `min_over_time`.
      - q: Сайт лёг вместе с ingress, а алерт на долю 5xx молчит. Почему?
        a: >-
          Он считает метрики ingress, а ingress умер — считать нечего. Алерты изнутри видят деградацию,
          но не полную смерть точки входа. Нужна проверка снаружи: blackbox exporter раз в 30 секунд
          открывает сайты через Cloudflare, `SiteDown` — через 2 минуты неудач.
    lab: ['06-troubleshooting — целиком', '12-operations — «Поломки ноды и DNS»', '03-observability — «Дни поломок»']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M19 «Диагностика — системный подход» · «Ситуации»:
        локализуй слой по симптому.
      - >-
        Kubernetes (k8s-cheatsheet), M2 «Контейнер под капотом и что делает kubelet» ·
        «Что важно знать»: проследи, кто тянет образ и кто запускает процесс в цепочке kubelet → CRI → containerd → runc.
      - >-
        Kubernetes (k8s-cheatsheet), «Памятка-оси» · § 7–8: слой симптома и ступень диагностики.
      - >-
        Сети для DevOps, M18 «Диагностика, наблюдаемость, производительность» · § 1 «Лестница
        диагностики».
    seen: [situations/node-unreachable, situations/disk-full, situations/dns-slow, situations/site-down, runbooks/triage, runbooks/disk]
    drill: ['k8s: troubleshooting', 'сети: diagnostics', 'linux: systemd, logs, performance']

  - id: 15
    practice: >-
      После потери ноды под с local-path PVC остаётся Pending. Объясни, где лежат данные,
      почему новый под не может их прочитать и из какого артефакта можно восстановиться. Сверь
      с `1-5`.
    practice_check: >-
      PVC остаётся привязан к PV, а диск local-path — к исходной ноде. У StatefulSet может быть
      ещё старый под с неопределённым состоянием. Если диск утрачен, нужен резервный артефакт
      данных приложения или реплика. Снимок etcd восстанавливает объекты API, а содержимое тома
      требует отдельного источника.
    title: 'Конфиг, секреты, хранилище'
    area: Приложения
    status: todo
    brief: >-
      Под живёт недолго, а данным и настройкам нужно жить дольше. Конфиг приходит в под из ConfigMap,
      пароли — из Secret: переменными окружения или файлами. Данные — на томах: под просит место через
      PVC, а StorageClass и провижинер выдают PV. На голом kubeadm провижинера нет, в лабе стоит
      local-path — том на диске конкретной ноды, и под с ним больше никуда не уедет. Поэтому StatefulSet с
      томом — ещё не база: репликации, переключения и бэкапа он не даёт.
    steps: [1-5]
    step_focus:
      1-5: >-
        Найди, почему после отказа ноды StatefulSet с local-path не переехали и когда вернулись
        приложения.
    read:
      - title: Persistent Volumes
        url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
        note: >-
          PV, PVC, StorageClass, режимы доступа и политика возврата. Хватит первых разделов, до «Types of
          Persistent Volumes».
        lang: en
        min: 15
      - title: ConfigMaps
        url: https://kubernetes.io/docs/concepts/configuration/configmap/
        note: >-
          Как конфиг попадает в под — переменными или файлами — и что из этого обновляется на лету.
        lang: en
        min: 10
      - title: Good practices for Kubernetes Secrets
        url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
        note: >-
          Что делать с Secret: шифрование в etcd, минимум прав на чтение, внешние хранилища.
        lang: en
        min: 6
    questions:
      - q: Создал PVC на свежем kubeadm-кластере, а он висит в Pending. Почему?
        a: >-
          Томы некому выдавать: в облачном кластере это делает CSI-драйвер провайдера, а на голом kubeadm
          его нет. Нужен провижинер — у нас local-path — и StorageClass по умолчанию. Ещё вариант — режим
          `WaitForFirstConsumer`: PVC ждёт, пока появится под, и это норма.
      - q: Зачем `WaitForFirstConsumer`?
        a: >-
          Отложить выбор или создание тома, пока появится pod и станут известны ограничения его
          размещения. Это помогает совместить узел для pod и топологию диска. Применимость
          зависит от StorageClass и драйвера.
      - q: Чем опасен local-path для баз и мониторинга?
        a: >-
          Такой том привязан к ноде: под с ним больше никуда не уедет. На отказе ноды Prometheus,
          Alertmanager и Loki просто ждали, пока она вернётся, и мониторинг лёг целиком. Для прода —
          сетевое хранилище или репликация на уровне самого приложения.
      - q: Что значит ReadWriteOnce?
        a: >-
          Том монтируется на чтение и запись на одну **ноду**, а не на один под: два пода на одной ноде
          смонтируют его оба. Нужен строго один под — `ReadWriteOncePod`. Для баз это важно: два процесса
          Postgres на одних файлах — порча данных.
      - q: У тебя StatefulSet с PVC — бэкап есть?
        a: >-
          Нет. PVC — данные на диске одной ноды, а не копия. Бэкап — копия в другом месте с проверенным
          восстановлением: минимум `pg_dump` по CronJob в объектное хранилище, по-хорошему — физический
          бэкап с архивом WAL. Бэкап, из которого ни разу не восстанавливались, бэкапом не считается.
      - q: Конфиг в ConfigMap поменяли, а приложение работает по-старому. Почему?
        a: >-
          Переменные окружения читаются только при старте контейнера — нужен рестарт пода. Файл из тома
          kubelet обновит сам через какое-то время, но только без `subPath`: файл, смонтированный через
          `subPath`, не обновляется никогда. И даже свежий файл приложение должно перечитать само.
      - q: Чем Secret отличается от ConfigMap, кроме названия?
        a: >-
          Устроены почти одинаково, но Secret можно отдельно зашифровать в etcd, на ноде kubelet держит его
          в памяти (tmpfs), а не на диске, и права на чтение секретов выдают отдельно. При этом base64 — не
          шифрование: кто может читать секреты в namespace — например, роль `edit`, — тот видит пароли.
      - q: Масштабировал Postgres до двух реплик — почему репликации нет?
        a: >-
          StatefulSet даёт второму поду имя и пустой том, но ничего не знает о Postgres: кто primary, как
          гнать WAL, как переключаться. Это задача приложения или оператора — CloudNativePG, Patroni.
          Голый `scale` даёт две независимые пустые базы.
    lab: ['02-platform — «local-path-provisioner — хранилище»', '08-databases — «Бэкапы»']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M7 «ConfigMap и Secret» · «Ситуации»: обновление через env
        и файл.
      - >-
        Kubernetes (k8s-cheatsheet), M8 «Storage — тома, PV, PVC» · «Что важно знать»: PV, PVC,
        StorageClass и жизненный цикл данных.
    seen: []
    drill: ['k8s: config-secrets, storage']

  - id: 16
    practice: >-
      Пользователю нужен доступ к логам подов в одном namespace. Назови, какие права выдашь и
      как проверишь разрешённый запрос и запрет в соседнем namespace.
    practice_check: >-
      Для чтения логов нужен `get` на `pods/log` в Role и RoleBinding в целевом namespace.
      `get`/`list` на `pods` добавь, если человек должен искать поды. Проверь `auth can-i get
      pods --subresource=log` в двух namespace с нужной identity и группами.
    title: 'Доступ и безопасность: RBAC и слабые места'
    area: Безопасность
    status: todo
    brief: >-
      В Kubernetes нет объектов «пользователь» и «группа»: имя и группы приходят с каждым запросом — у
      клиентского сертификата поле CN означает имя, а O — группы. Кластер хранит только правила RBAC:
      «группе X можно Y в namespace Z». `admin.conf` от kubeadm — ключ от всего, и ходить с ним каждый день
      — как работать под root. Поэтому в лабе свой пользователь с правами на группу через GitOps и
      ServiceAccount с минимумом прав для программы. Слабые места записаны честно: Pod Security,
      NetworkPolicy для баз, секреты вне git — это блок 5.
    steps: [1-6]
    step_focus:
      1-6: >-
        Сверь проверку реальной учётной записью и `auth can-i`. Вспомни один разрешённый и один
        запрещённый запрос.
    read:
      - title: The mechanics of Kubernetes RBAC
        url: https://learnkube.com/rbac-kubernetes
        note: >-
          Прочитай фрагмент о ролях и привязках. Проследи один запрос от пользователя или ServiceAccount.
        lang: en
        min: 12
      - title: Pod Security Standards
        url: https://kubernetes.io/docs/concepts/security/pod-security-standards/
        note: >-
          Три уровня — privileged, baseline, restricted — и что запрещает каждый. В лабе ещё не включено,
          это шаг 5-2.
        lang: en
        min: 10
    questions:
      - q: Как кластер понимает, кто ты, если объекта «пользователь» нет?
        a: >-
          Имя и группы приходят с каждым запросом вместе с учётными данными: у сертификата CN — имя,
          O — группы, у OIDC — поля токена, у ServiceAccount — `system:serviceaccount:<ns>:<имя>`. Кластер
          хранит только RBAC — кому что можно. Поэтому «вошёл, но Forbidden» — нормальное состояние нового
          пользователя без привязок.
      - q: Role или ClusterRole, RoleBinding или ClusterRoleBinding?
        a: >-
          Роль описывает права, привязка — кому и где. ClusterRole можно привязать RoleBinding'ом — тогда
          она действует только в этом namespace. Так и сделано: встроенная `edit` одна на кластер плюс
          RoleBinding в нужных namespace, а ClusterRoleBinding — только на `view`.
      - q: Почему `edit` нельзя давать во все namespace?
        a: >-
          `edit` разрешает создать под с любым ServiceAccount своего namespace — и получить его права. В
          `argocd` или `monitoring` у ServiceAccount'ов широкие права, значит `edit` там — почти
          cluster-admin. К тому же `edit` читает секреты своего namespace, а `view` — нет.
      - q: Человек уволился — как забрать доступ, если он по сертификату?
        a: >-
          Полностью — никак: список отзыва apiserver не проверяет, и сертификат действует до срока.
          Снимаю привязки — права уходят сразу, а вход остаётся до `notAfter`. Поэтому короткий срок, а
          для людей в проде — OIDC: отключил учётку, и токен умер через час. Если в сертификате
          `system:masters` — только смена CA.
      - q: Как проверить, что у человека есть права?
        a: >-
          `kubectl auth can-i <глагол> <ресурс> -n <ns> --as <имя>`. Ловушка: `--as ivan` даёт `no`, а
          `--as ivan --as-group lab-devs` — `yes`: `--as` подменяет только имя, а права выданы на группу.
      - q: Что опаснее всего выдать, кроме cluster-admin?
        a: >-
          То, что даёт его в обход: одобрение запросов на клиентские сертификаты, `impersonate` на группы,
          `bind` и `escalate` на роли, `edit` в namespace с мощным ServiceAccount — и push в gitops-репо:
          ArgoCD применяет манифесты своим ServiceAccount с полными правами.
      - q: Как внедрить Pod Security, не сломав прод?
        a: >-
          Pod Security Admission встроен и включается метками namespace. Сначала `warn` и `audit` уровня
          `baseline` на прикладные namespace, правка манифестов по предупреждениям, потом `enforce`.
          Системным namespace, которым законно нужен хост (ingress на hostNetwork, node-exporter, CNI), —
          `privileged`. В лабе пока не сделано, это шаг 5-2.
      - q: Что закрыл бы первым из слабых мест и почему?
        a: >-
          NetworkPolicy для namespace с базами: это полчаса работы, а без неё любой под ходит к базе.
          Потом Pod Security `baseline` — без него любой под может стать root на ноде. Потом Sealed Secrets,
          чтобы секреты можно было восстановить из git. Порядок — по соотношению риска к стоимости.
    lab: ['13-security — «Что уже сделано хорошо», «Слабые места», «RBAC: свои пользователи вместо admin.conf»', '12-operations — «RBAC»', 'interview/rbac — целиком', '04-workloads — «requests и limits»']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M16 «RBAC и identity» · «Ситуации»: откуда берутся
        пользователь и группы, как проверить доступ ServiceAccount.
      - >-
        Kubernetes (k8s-cheatsheet), M17 «Namespaces, квоты, мультитенантность» · «Что важно знать»:
        сравни суммарную ResourceQuota и правила LimitRange для отдельных объектов. Квоты в лабе пока теория.
      - >-
        Kubernetes (k8s-cheatsheet), M18 «Периметр пода: политики и supply chain» · «Ситуации»:
        что ограничивает Pod Security и что ограничивает NetworkPolicy.
    seen: [situations/kubectl-no-connection]
    drill: ['k8s: rbac, namespaces-quotas, pod-security']

  - id: 17
    practice: >-
      Pod не может открыть Service по имени. Назови три проверки по очереди: DNS из того же
      namespace, EndpointSlice, ответ по адресу пода. Объясни, как последовательность
      локализует проблему.
    practice_check: >-
      Из исходного pod сравни короткое имя с полным. Если имя разрешается, сверь ready-адреса в
      EndpointSlice и целевой порт. Под отвечает по IP, а Service нет — проверяй путь через
      Service. При успешном IP и неуспешном имени отдельно разбирай DNS.
    title: Service и DNS внутри кластера
    area: Сеть
    status: todo
    brief: >-
      Поды меняются, поэтому к ним ходят через Service с постоянным именем. Для ClusterIP
      kube-proxy направляет соединение к готовому поду. Селектор определяет, какие поды
      относятся к Service, а EndpointSlice хранит их адреса и условия готовности. CoreDNS даёт
      имя `сервис.namespace.svc.cluster.local`, а короткое имя дополняется search-доменами.
    steps: [1-8]
    step_focus:
      1-8: >-
        Найди разницу запросов по имени и IP при остановленном CoreDNS и повтор после
        восстановления.
    read:
      - title: Learn why you can't ping a Kubernetes service
        url: https://dev.to/danielepolencic/learn-why-you-cant-ping-a-kubernetes-service-3nlm
        note: >-
          Как kube-proxy превращает ClusterIP в правила iptables и почему по этому адресу никто не
          отвечает.
        lang: en
        min: 4
      - title: DNS for Services and Pods
        url: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
        note: >-
          Какие имена получают Service и поды, search-домены и `ndots`.
        lang: en
        min: 12
    questions:
      - q: Service есть, DNS резолвится, а соединения висят. Что первое?
        a: >-
          Проверь EndpointSlice для Service и условия `ready` у адресов. Адресов нет — сверь selector
          с метками подов. Адреса есть и не готовы — разбирай readiness. Если адреса готовы,
          проверь `targetPort` и сетевые политики.
      - q: Почему ClusterIP не пингуется?
        a: >-
          Его нет ни на одном интерфейсе ни одной машины — это только правило. kube-proxy пишет на каждой
          ноде правила iptables: пакет на ClusterIP и порт сервиса уходит на адрес случайного пода. ICMP
          этими правилами не покрыт. На ноде это видно: адреса на интерфейсах нет, а правила есть.
      - q: Какие бывают Service и когда нужен headless?
        a: >-
          ClusterIP — виртуальный адрес внутри кластера, NodePort — порт на каждой ноде, LoadBalancer —
          облачный балансировщик, ExternalName — CNAME. Headless (`clusterIP: None`) — DNS отдаёт адреса
          самих подов: так у StatefulSet каждый под получает стабильное имя вида
          `postgres-0.postgres.data.svc.cluster.local`.
      - q: gRPC-сервис из трёх подов, а вся нагрузка идёт в один. Почему?
        a: >-
          kube-proxy балансирует соединения, а не запросы, а gRPC держит одно долгое HTTP/2-соединение —
          и оно прилипло к одному поду. Решения: балансировка на клиенте через headless-сервис, L7-прокси
          или mesh, либо ограничить срок жизни соединения на сервере.
      - q: Почему большие кластеры уходят с iptables?
        a: >-
          Правила проверяются цепочкой подряд: при тысячах сервисов медленным становится каждый пакет и
          каждое обновление правил. Альтернативы — IPVS, nftables, eBPF. Cilium умеет заменить kube-proxy
          целиком; у нас это выключено, kube-proxy работает в режиме iptables.
      - q: Что такое `ndots:5` и почему это мина?
        a: >-
          Имя, где меньше пяти точек, сначала пробуется со всеми search-доменами: `api.github.com` у нас
          давал шесть запросов к DNS, пять из них мимо. Под нагрузкой это кратно умножает трафик на CoreDNS.
          Лечится точкой в конце имени (`api.github.com.`) или `ndots: 2` в `dnsConfig` пода.
      - q: «У приложения не резолвится». Порядок проверки?
        a: >-
          Из пода: `/etc/resolv.conf` (nameserver — адрес CoreDNS), `nslookup` короткого и полного имени.
          Живы ли поды CoreDNS и есть ли у сервиса `kube-dns` эндпоинты, что в логах CoreDNS. Закрыт egress
          NetworkPolicy — пропущен ли порт 53. Короткое имя из чужого namespace не резолвится — нужно
          `сервис.namespace`.
    lab: ['11-objects-and-service-network — «Метки и селекторы — клей всего», «Service: какие бывают», «ClusterIP — адрес, которого нет», «DNS внутри кластера»']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M6 «Labels, selectors, аннотации» · «Что важно знать»:
        сопоставь selector Service с метками Pod и проверь, как несовпадение отражается на EndpointSlice.
      - >-
        Kubernetes (k8s-cheatsheet), M10 «Service и kube-proxy» · «Что важно знать»: selector,
        EndpointSlice и виртуальный адрес.
      - >-
        Kubernetes (k8s-cheatsheet), M11 «DNS в кластере (CoreDNS)» · «Ситуации»: имя из другого
        namespace и ndots.
      - >-
        Сети для DevOps, M7 «DNS» · раздел о порядке резолва и кэшировании.
    seen: [situations/dns-slow]
    drill: ['k8s: labels-selectors, services, cluster-dns', 'сети: dns']

  - id: 18
    practice: >-
      Представь, что мелкие запросы проходят между нодами, а крупные зависают. Назови
      наблюдения, которые отличат проблему MTU от запрета NetworkPolicy, и вспомни поправку на
      VXLAN в лабе.
    practice_check: >-
      Повтори как можно ближе к одному и тому же пути: маленький и большой запросы между нодами.
      Размерозависимый сбой указывает на MTU или PMTUD. Для политики проверь выбранные
      pod/namespace и направление трафика. В лабе VXLAN уменьшает MTU с 1460 до 1410.
    title: 'Сеть подов: CNI и Cilium'
    area: Сеть
    status: todo
    brief: >-
      Модель сети Kubernetes простая: у каждого пода свой IP, и любой под достучится до любого без NAT. Как
      это сделать, решает CNI-плагин, в лабе — Cilium. Внутри ноды под живёт в своём сетевом пространстве
      имён, соединённом с нодой виртуальным «кабелем» veth. Между нодами Cilium заворачивает пакет пода в
      UDP (VXLAN): это съедает 50 байт, и подам в GCP достаётся MTU 1410 вместо 1460. NetworkPolicy —
      файрвол на уровне подов, и работает он, только если CNI его умеет.
    steps: [2-5]
    step_focus:
      2-5: >-
        Найди опыт после сценариев: запрет пути до podinfo дал внешний 503 при живом ingress.
    read:
      - title: Tracing the path of network traffic in Kubernetes
        url: https://learnkube.com/kubernetes-network-packets
        note: >-
          Сравни только схемы пути на одной ноде и между нодами. Объясни, где появляется туннель.
        lang: en
        min: 12
      - title: Introduction to Cilium & Hubble
        url: https://docs.cilium.io/en/stable/overview/intro/
        note: >-
          Что Cilium делает поверх CNI: сеть подов, политики на eBPF и видимость трафика через Hubble.
        lang: en
        min: 10
    questions:
      - q: Как под на одной ноде достучится до пода на другой?
        a: >-
          У каждой ноды свой кусок сети подов. Пакет из сетевого пространства пода уходит через veth на
          ноду, там CNI решает, куда его отправить: Cilium заворачивает пакет в UDP (VXLAN) и шлёт на нужную
          ноду, где его разворачивают и отдают поду. Без туннеля нужны маршруты в облаке — это native
          routing, он быстрее, но сложнее в настройке.
      - q: Почему MTU важен и какой симптом у проблемы с ним?
        a: >-
          VXLAN добавляет к пакету 50 байт заголовков: в GCP сеть 1460, подам остаётся 1410. Если MTU
          выставлен неверно, мелкие запросы ходят, а крупные виснут — при таком симптоме первым делом
          проверяют MTU.
      - q: Почему сеть подов не должна пересекаться с сетью нод?
        a: >-
          Иначе пакеты к адресам из пересечения уйдут не туда: нода не отличит под от соседней машины.
          Поэтому сеть подов задают при установке явно и не берут дефолт CNI, если он перекрывает сеть нод,
          — у Cilium дефолт как раз широкий.
      - q: Как работает NetworkPolicy?
        a: >-
          Политика выбирает поды и изолирует их по указанному направлению. Разрешения
          стандартных политик складываются. Если изолированы и источник по egress, и приёмник по
          ingress, соединение должно быть разрешено с обеих сторон. Нужен CNI с поддержкой
          NetworkPolicy.
      - q: Закрыл egress default-deny, и у приложения всё сломалось. Что забыл?
        a: >-
          DNS. Под перестал ходить в CoreDNS, и ни одно имя не резолвится. В egress-политике первым правилом
          идут UDP и TCP 53 до подов `kube-dns`, потом уже конкретные адреса.
      - q: NetworkPolicy пускает namespace ingress-nginx, а ingress получает 504. Почему?
        a: >-
          Ingress работает на hostNetwork: его пакеты идут с адреса ноды, и `namespaceSelector` их не видит.
          44 дня баг прикрывал случай: под жил на одной ноде с ingress, а трафик со своей ноды Cilium пускает
          всегда. Переезд подов вскрыл ошибку; фикс — CiliumNetworkPolicy с
          `fromEntities: [host, remote-node]`.
      - q: Как найти, какая политика режет трафик?
        a: >-
          `kubectl get netpol -A` и какие политики выбирают под по меткам. В Cilium отброшенные пакеты видны
          напрямую: `cilium-dbg monitor --type drop` или Hubble, где у каждого дропа написана причина. Без
          этого остаётся проверять curl'ом из подов по одному.
    lab: ['01-cluster — «Cilium и сеть»', '04-workloads — «NetworkPolicy»']
    gdoc:
      - >-
        Kubernetes (k8s-cheatsheet), M9 «Сетевая модель и CNI» · «Ситуации»: overlay и путь
        между нодами.
      - >-
        Сети для DevOps, M13 «Linux network internals» и M14 «Контейнерные сети (Docker)» ·
        найди namespace и veth, затем сопоставь с Cilium из M9.
    seen: []
    drill: ['k8s: cluster-networking', 'сети: linux-netns, container-networking']

  - id: 19
    practice: >-
      Сайт за Cloudflare отдаёт 522. Пройди цепочку DNS → Cloudflare → ingress → Service →
      под. Назови две проверки, которые разделяют недоступный origin и ошибку приложения.
    practice_check: >-
      522 в прожитом случае был таймаутом соединения Cloudflare с origin. Проверь доступность
      origin разрешённым путём, затем сравни обращение к ingress и к backend из сети кластера.
      Если соединение до ingress есть, код ответа и endpoints помогают отделить ошибку маршрута
      от ошибки приложения.
    title: 'Вход снаружи: ingress, TLS, Cloudflare'
    area: Сеть
    status: todo
    brief: >-
      Путь запроса в лабе: браузер → Cloudflare по TLS с сертификатом Cloudflare → второе TLS-соединение до
      ноды, где ingress-nginx на hostNetwork показывает сертификат Let's Encrypt → nginx выбирает Ingress
      по имени хоста → Service → под. Сертификаты выпускает cert-manager через DNS-01: кладёт TXT-запись
      через API Cloudflare, поэтому открытые порты для проверки не нужны. Origin закрыт для всех, кроме
      сетей Cloudflare, иначе всю защиту можно обойти запросом напрямую на адрес ноды.
