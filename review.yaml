# План повторения — источник правды для страницы review.html. Как вести — CLAUDE.md, «План повторения».
# Подробно, с источниками и ссылками на Google-конспекты, — k8s-lab-infra/docs/interview/review-plan.md.
#
# Тема: status todo | now | done (now — ровно одна), done — дата первого прохода,
# repeats — повторы {date, clean}, weak — что провисло, коротко.
# Срок повтора считается сам по лестнице ladder: после прохода 7 дней, каждый чистый повтор подряд —
# ступенька выше (21, потом 42), повтор с провалами — снова 7.
# steps — шаги лаба из roadmap.yaml. Каждый закрытый шаг обязан быть хотя бы в одной теме.
# Шаги, закрытые с restart и не попавшие в consolidated, — «свежие»: их закрепляет опрос Claude.
# read — базовые статьи, по одной на инструмент. lab — приватные конспекты k8s-lab-infra/docs,
# gdoc — модули Google-конспектов (только названия, без ссылок), seen — публичные runbook'и и ситуации.
# В текстах работают `код` и **жирный**.

start: '2026-11-09'
restart: '2026-11-22'
ladder: [7, 21, 42]
drill_url: https://tsim0710.github.io/devops-anki/
private_url: https://github.com/jjjopa5/k8s-lab-infra/blob/main/docs/

stages:
  - key: pass
    title: Первый проход темы
    time: 45–60 мин
    when: Сам, по этой странице. Одна тема за сессию, по порядку списка.
    why: >-
      Лаб даёт опыт, но через неделю детали стираются. Проход связывает три вещи: как это устроено
      (статья), что делал сам (шаги лаба) и как об этом спросят (вопросы). Вспоминать полезнее, чем
      перечитывать, поэтому сначала отвечаешь сам и только потом читаешь.
    steps:
      - name: Разогрев
        time: 5 мин
        how: >-
          Прочитай «Простыми словами». Пройди «Проверь себя», не раскрывая ответы: на каждый вопрос —
          своя фраза вслух. Где не смог, запомни: туда и пойдёт внимание.
      - name: Основа
        time: 10–15 мин
        how: >-
          Базовые статьи темы. Читай с вопросом: как это устроено под капотом и как я объясню это за
          минуту. Конспектировать не нужно.
      - name: Свои шаги
        time: 15 мин
        how: >-
          По каждому шагу лаба: запись журнала — что было и что стало. Потом итог шага 🔒: «Решения и
          что отбросили», «Что пошло не так». В конце — «Как рассказать на собесе»: сначала сам вслух,
          потом сверка с текстом.
      - name: Теория по провалам
        time: 10 мин
        how: >-
          Модули Google-конспекта — только там, где споткнулся. «📌» и «🎯 Ситуации»: свой ответ вслух,
          потом сверка. Модуль подряд целиком не перечитывать.
      - name: Проверка
        time: 10 мин
        how: >-
          «Проверь себя» ещё раз, теперь раскрывая ответ после своего. Потом тренажёр: подтемы темы,
          уровни middle и senior.
      - name: Итог
        time: 2 мин
        how: >-
          Напиши Claude: «прошёл тему N, провисло: …». Провисшее встанет первым в повтор, срок повтора
          посчитается сам.

  - key: fresh
    title: Свежий шаг лаба
    time: 5–10 мин
    when: >-
      Опрос Claude в начале следующей лаб-сессии, пока поднимается лаб. Свежие — шаги, закрытые
      с 22.11.
    why: >-
      Закрепить, пока детали свежие: через день рассказ о шаге складывается за минуту, через месяц —
      уже по бумажке.
    steps:
      - name: Что было и что стало
        how: Простыми словами, как объяснил бы коллеге, который не видел лаба.
      - name: Почему так
        how: Какое решение принял, какую альтернативу отбросил и чем она хуже именно здесь.
      - name: Что сломалось
        how: Что пошло не так по ходу, какая была ложная гипотеза и как нашёл причину.
      - name: Рассказ для собеса
        time: 2 мин
        how: Задача → что сделал → где сломалось → как нашёл → результат с цифрой. Без подглядывания.
      - name: Отметка
        how: Claude отмечает шаг закреплённым. Дальше шаг живёт в повторах своей темы.

  - key: repeat
    title: Повтор по сроку
    time: 10–20 мин
    when: >-
      Опрос Claude в начале лаб-сессии или сам по странице, 15–20 минут. Чей срок пришёл — видно
      в «Сегодня».
    why: >-
      Вспоминать через растущие промежутки — самый дешёвый способ помнить долго. Повтор через неделю
      после прохода, после чистого повтора — через три, потом через шесть. Споткнулся — снова через
      неделю.
    steps:
      - name: Провисшее
        how: Начать с «Провисло» — с того, что не далось в прошлый раз.
      - name: Вопросы
        how: «Проверь себя» вслух, без подсказок. Ответ раскрывать только после своего.
      - name: Рассказ по шагам
        how: По каждому шагу темы — «как на собесе», 1–2 минуты.
      - name: Тренажёр
        time: 5 мин
        how: Подтемы темы, middle и senior.
      - name: Итог
        how: >-
          «Чисто» или «провисло: …» — Claude записывает повтор, следующий срок посчитается сам.

  - key: daily
    title: Тренажёр каждый день
    time: 10–15 мин
    when: С телефона — в дороге или между делами.
    why: >-
      Карточки показывают, знаешь ли ты ответ или только узнаёшь его, когда видишь. Перемешанные
      подтемы заставляют вспоминать, а не угадывать по соседним вопросам.
    steps:
      - name: Фильтр
        how: Домен k8s, уровни middle и senior, подтемы уже пройденных тем вперемешку.
      - name: Честно
        how: Не вспомнил за 10 секунд — «не знаю». Такие карты тренажёр сам ставит в начало очереди.
      - name: Junior
        how: Только если сыпется middle.

  - key: interview
    title: Перед собесом
    time: за 1–2 дня
    when: Под конкретную вакансию.
    why: >-
      На собесе спрашивают не факты, а «как бы ты сделал» и «расскажи, как было у тебя». За день до
      него нужны оси для вывода ответа и готовые истории, а не новые знания.
    steps:
      - name: Оси
        how: >-
          Kubernetes, «Памятка-оси» — целиком: по ним выводишь ответ, когда факт не вспомнился.
      - name: Сети
        how: >-
          Справочник сетевого конспекта: часть 1 бегло, часть 2 (кейсы) вслух, «Философия» и «Мои
          личные грабли».
      - name: Карточки защиты
        how: >-
          Журнал 08.11 (блок 1) и 17.11 (блок 2) — вслух, как ответ на «расскажите о проекте».
      - name: Темы вакансии
        how: По темам из вакансии — «Проверь себя» и «Как рассказать на собесе» по их шагам.
      - name: Резюме
        how: >-
          `interview/resume-map.md` 🔒 — по каждой строке резюме вспомнить шаг и цифру. Затем
          `interview/rbac.md` 🔒.

consolidated: {}

topics:
  - id: 1
    title: Архитектура кластера и оси
    area: Кластер
    status: done
    done: '2026-11-09'
    brief: >-
      Кластер — это apiserver, через который ходят все, etcd, где лежит всё состояние, и контроллеры,
      которые в цикле доводят «как есть» до «как должно быть». В kubeadm сам control plane — статические
      поды: их запускает kubelet по файлам на диске, без всякого API. Три мастера нужны ради кворума
      etcd, а VIP с HAProxy — чтобы клиенты не зависели от одного адреса. В лабе HA собран, измерен
      и потом свёрнут обратно в один мастер ради ядер.
    steps: [1-7, 2-7]
    read:
      - title: Cluster Architecture
        url: https://kubernetes.io/docs/concepts/architecture/
        note: >-
          Кто есть кто в кластере и кто с кем говорит. В конце — варианты развёртывания, включая
          статические поды, как у kubeadm.
        lang: en
        min: 10
      - title: Options for Highly Available Topology
        url: https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/ha-topology/
        note: >-
          Stacked etcd против отдельного кластера etcd: что падает вместе и сколько машин нужно.
        lang: en
        min: 4
    questions:
      - q: Кто запускает control plane в kubeadm-кластере, если apiserver ещё нет?
        a: >-
          kubelet — по манифестам из `/etc/kubernetes/manifests`: apiserver, etcd, scheduler и
          controller-manager поднимаются без всякого API. В `kubectl` видно только их отражение
          (mirror-под), поэтому `kubectl delete pod` их не перезапускает: манифест выносят из каталога
          и возвращают.
      - q: Кто с кем говорит в кластере?
        a: >-
          Все говорят только с apiserver, и только он ходит в etcd. Scheduler выбирает поду ноду,
          контроллеры доводят фактическое состояние до желаемого, kubelet запускает контейнеры через
          containerd и пишет статус. Друг друга напрямую они не зовут — каждый следит за своими
          объектами через watch.
      - q: Почему мастеров три, а не два?
        a: >-
          etcd принимает запись, только когда согласно большинство участников — кворум. Из двух нужны
          оба: падение любого останавливает запись, и это хуже одного мастера. Три переживают потерю
          одного, пять — двух, чётное число ничего не добавляет.
      - q: Stacked etcd или отдельный кластер etcd?
        a: >-
          Stacked — etcd на тех же мастерах: меньше машин, kubeadm так делает по умолчанию, но мастер
          и участник etcd падают вместе и делят один диск. Отдельный etcd — ещё три машины ради
          изоляции. Для небольшого кластера stacked — нормальный выбор.
      - q: Как работал VIP в GCP и зачем HAProxy, если VIP уже есть?
        a: >-
          keepalived выбирает главного мастера, но сеть GCP не верит ARP: новый главный сам через API
          облака перевешивает alias IP на себя. VIP ведёт на одну машину, а HAProxy на ней раздаёт
          соединения всем живым apiserver, проверяя `/readyz`. Переключение в лабе — около 9 секунд.
      - q: Упали два мастера из трёх. Что с кластером?
        a: >-
          Кворума etcd нет: записи не проходят, управлять кластером нельзя, но уже запущенные поды
          работают. Вернулись мастера — кворум соберётся сам. Не вернулись — etcd на выжившем участнике
          с `--force-new-cluster` или восстановление из снимка, потом участников добавляют заново.
      - q: Почему HA свернули обратно в один мастер и как убирали мастера?
        a: >-
          Триал держит включёнными только 8 ядер, все были заняты, а потерю воркера кластер уже не
          переживал — горел `WorkersOvercommit`. HA к тому времени был собран и отрепетирован, и ядра
          двух мастеров ушли под третий воркер. Убирали по одному через `kubeadm reset`, чтобы кворум
          etcd был на каждом шаге.
    lab: ['01-cluster — до раздела «etcd»', '14-ha-control-plane — целиком']
    gdoc: ['Kubernetes: «Памятка-оси»', 'Kubernetes: M1, M2, M3']
    seen: [situations/kubectl-no-connection, runbooks/components-down, runbooks/workers-overcommit]
    drill: ['k8s: architecture, kubelet-runtime, api-model']

  - id: 2
    title: 'Prometheus изнутри: сбор метрик и экспортеры'
    area: Наблюдаемость
    status: now
    brief: >-
      Prometheus сам ходит за цифрами: раз в полминуты опрашивает по HTTP страницы `/metrics` у
      сервисов и экспортеров — это модель pull. Кого опрашивать, он узнаёт из Kubernetes: в
      kube-prometheus-stack это объекты ServiceMonitor. Экспортер — переводчик: читает чужие данные
      (ядро ноды, объекты API, внешний сайт) и отдаёт их в формате Prometheus. Точки лежат в его
      собственной базе временных рядов на диске. Главный урок ревизии 2-1: горящий Watchdog ещё не
      значит, что данные пишутся.
    steps: [2-1]
    read:
      - title: 'Learn Prometheus Architecture: A Complete Guide'
        url: https://devopscube.com/prometheus-architecture/
        note: >-
          Из чего состоит Prometheus: опрос целей, база временных рядов, поиск целей, экспортеры,
          Pushgateway, Alertmanager — со схемами.
        lang: en
        min: 14
      - title: kube-state-metrics — README
        url: https://github.com/kubernetes/kube-state-metrics
        note: >-
          Что отдаёт kube-state-metrics и чем он отличается от metrics-server. Хватит начала и раздела
          «kube-state-metrics vs. metrics-server».
        lang: en
        min: 6
    questions:
      - q: Pull или push — как Prometheus получает метрики и почему так?
        a: >-
          Сам опрашивает цели по HTTP (`/metrics`) с заданным интервалом. Так Prometheus сам решает,
          какую нагрузку держать, а мёртвая цель сразу видна: у каждой цели есть метрика `up`, и
          `up == 0` — первое, что ставят в алерт. Для коротких задач, которые не доживают до опроса,
          есть Pushgateway.
      - q: node-exporter, kube-state-metrics, cAdvisor — в чём разница?
        a: >-
          node-exporter — железо и ОС ноды: CPU, память, диски. kube-state-metrics — состояние
          объектов API: сколько реплик готово, сколько рестартов. cAdvisor встроен в kubelet и даёт
          реальное потребление контейнеров (`container_*`). «Деплоймент деградировал» — это
          kube-state-metrics, «под ест память» — cAdvisor.
      - q: Создал ServiceMonitor, а цели в Prometheus нет. Что проверяешь?
        a: >-
          Подхватывает ли Prometheus чужие ServiceMonitor: в kube-prometheus-stack по умолчанию — только
          свои. Совпадает ли selector с метками Service (не пода), указан ли порт по имени из Service,
          пускает ли namespaceSelector. Дальше — страница targets и логи prometheus-operator. Ещё
          скрейп может молча резать NetworkPolicy.
      - q: Почему дашборды scheduler, controller-manager и etcd были пустыми?
        a: >-
          В kubeadm они слушают только `127.0.0.1`, и Prometheus из пода до них не достаёт. Открыли
          `bind-address=0.0.0.0`, но не `sed`'ом по манифестам, а в `kubeadm-config`: иначе
          `kubeadm upgrade` пересоберёт манифесты и правку сотрёт.
      - q: Watchdog горит — значит, мониторинг работает?
        a: >-
          Нет. Watchdog горит, пока живы Prometheus и Alertmanager, даже если в базу не пишется ни одной
          точки. В лабе так прошли двое суток: часы на ноде убегали на два года вперёд, и база
          отбрасывала всё новое как устаревшее. Смерть мониторинга ловит внешний сторож по Watchdog,
          слепоту — своё правило «данных нет».
      - q: Зачем пересматривать 159 готовых правил до подключения Telegram?
        a: >-
          Чтобы не утонуть в шуме: первым же утром пришло бы 20 сообщений, половина про ерунду, и через
          неделю их перестали бы читать. По каждой группе решали — оставить, заглушить или
          переписать. Часть правил оказалась неверной для нашей схемы: запас памяти на случай потери
          воркера считался вместе с мастерами.
      - q: Падение одной ноды унесло весь мониторинг. Что менять?
        a: >-
          В лабе Prometheus, Alertmanager и Loki жили на дисках одной ноды, и при её отказе алерт
          слать стало некому. Минимум — внешний сторож на Watchdog. Дальше — реплики на разных нодах,
          сетевое хранилище или remote_write во внешнее хранилище.
    lab: ['03-observability — «Из чего собран мониторинг», «Как Prometheus узнаёт, кого опрашивать», «Метрики control-plane», «Ревизия алертов»']
    gdoc: ['Kubernetes: M20']
    seen: [situations/monitoring-lies, situations/monitoring-node-down, runbooks/prometheus-no-data]
    drill: ['k8s: observability']

  - id: 3
    title: 'PromQL и Grafana: запросы и дашборды'
    area: Наблюдаемость
    status: todo
    brief: >-
      PromQL — язык вопросов к Prometheus. Счётчик только растёт, поэтому у него смотрят не значение, а
      скорость — `rate()`. Gauge — текущее значение, его берут как есть. Задержку считают из гистограммы:
      `histogram_quantile()` по корзинам. Grafana сама ничего не хранит: панель — это запрос к источнику
      данных плюс оформление. Дашборд «Обзор лаба» лежит JSON-ом в git, его пороги совпадают с
      алертами, а первое, что он показал, — алерты на ingress стерегли пустоту.
    steps: [2-6]
    read:
      - title: Understanding metric types
        url: https://prometheus.io/docs/tutorials/understanding_metric_types/
        note: >-
          Четыре типа метрик и как запрашивать каждый: `rate` для счётчика, `histogram_quantile` для
          гистограммы.
        lang: en
        min: 4
      - title: Grafana — Dashboards overview
        url: https://github.com/grafana/grafana/blob/main/docs/sources/fundamentals/dashboards-overview/index.md
        note: >-
          Цепочка Grafana: источник данных → запрос → панель → дашборд. Это страница документации в
          репо Grafana: grafana.com из РБ без VPN отдаёт 451.
        lang: en
        min: 9
    questions:
      - q: rate, irate, increase — когда что?
        a: >-
          Все три работают со счётчиками и переживают их сброс при рестарте. `rate` — средний прирост в
          секунду за окно, для алертов и графиков. `irate` — по двум последним точкам, дёрганый, только
          для графиков всплесков. `increase` — прирост в штуках, «сколько рестартов за час». Окно —
          минимум в 4 раза больше интервала опроса.
      - q: Counter, gauge, histogram — чем отличаются и как их запрашивать?
        a: >-
          Counter только растёт и сбрасывается при рестарте — к нему `rate` или `increase`. Gauge ходит
          вверх и вниз — берут как есть или `avg_over_time`. Histogram раскладывает наблюдения по
          корзинам `_bucket`, перцентиль считает
          `histogram_quantile(0.99, sum by (le) (rate(..._bucket[5m])))`.
      - q: Почему память пода смотрят по working_set, а не по usage?
        a: >-
          `container_memory_usage_bytes` включает page cache, который ядро отдаст по первому требованию,
          — по нему все выглядят прожорливыми. Working set — то, что вытеснить нельзя, по нему kubelet
          решает выселение. Алерт «скоро OOM» — working_set против limit.
      - q: Плитка показывает «No data», хотя всё хорошо. Почему?
        a: >-
          `count(<плохое>)` при нуле проблем возвращает пустой результат, а не 0. Добавляют
          `or vector(0)`. С долей ошибок то же: рядов с 5xx нет — линия пропадает, поэтому
          `ошибки or 0 * запросы`.
      - q: Как хранишь дашборды Grafana?
        a: >-
          JSON-ом в git: kustomize собирает из файла ConfigMap с меткой, сайдкар Grafana его
          подхватывает, ArgoCD выкатывает. Сохранить в интерфейсе нельзя — правка через экспорт JSON и
          коммит. В CI проверяются JSON, uid и источники данных: битый файл Grafana пропускает молча.
      - q: Почему дашборд и алерт не должны считать по-разному?
        a: >-
          Иначе на дашборде всё зелёное, а алерт горит, и непонятно, кому верить. У нас пороги плиток
          совпадают с порогами алертов, а цифры берутся из тех же recording rules.
      - q: Что дашборд показал сразу после выкатки?
        a: >-
          Через ingress шло 0.03 запроса в секунду — только внешние пробы. Генератор нагрузки ходил в
          магазин мимо ingress, и алерты на ошибки и задержку ingress стерегли пустоту. Генератор
          пустили через ingress внутри сети: через публичный адрес это был бы платный исходящий трафик.
    lab: ['03-observability — «PromQL: минимум, который нужен», «Дашборд «Обзор лаба»»']
    gdoc: ['Kubernetes: M20']
