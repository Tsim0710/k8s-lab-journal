  - id: 19
    practice: >-
      Сайт за Cloudflare отдаёт 522. Пройди цепочку DNS → Cloudflare → ingress → Service →
      под. Назови две проверки, которые разделяют недоступный origin и ошибку приложения.
    title: 'Вход снаружи: ingress, TLS, Cloudflare'
    area: Сеть
    status: todo
    brief: >-
      Путь запроса в лабе: браузер → Cloudflare по TLS с сертификатом Cloudflare → второе TLS-соединение до
      ноды, где ingress-nginx на hostNetwork показывает сертификат Let's Encrypt → nginx выбирает Ingress
      по имени хоста → Service → под. Сертификаты выпускает cert-manager через DNS-01: кладёт TXT-запись
      через API Cloudflare, поэтому открытые порты для проверки не нужны. Origin закрыт для всех, кроме
      сетей Cloudflare, иначе всю защиту можно обойти запросом напрямую на адрес ноды.
    steps: [2-5, 2-6]
    read:
      - title: Ingress
        url: https://kubernetes.io/docs/concepts/services-networking/ingress/
        note: >-
          Ingress и IngressClass, правила по хостам и путям, TLS. Хватит разделов до типов Ingress.
        lang: en
        min: 12
      - title: What happens in a TLS handshake? — Cloudflare
        url: https://www.cloudflare.com/learning/ssl/what-happens-in-a-tls-handshake/
        note: >-
          Рукопожатие по шагам: сертификат, его проверка, общий ключ — и чем отличается TLS 1.3.
        lang: en
        min: 8
      - title: cert-manager — ACME
        url: https://cert-manager.io/docs/configuration/acme/
        note: >-
          Как Let's Encrypt проверяет, что домен твой: HTTP-01 и DNS-01.
        lang: en
        min: 10
    questions:
      - q: Опиши путь запроса от браузера до пода.
        a: >-
          Браузер → Cloudflare по TLS с сертификатом Cloudflare → второе TLS-соединение до ноды, где
          ingress-nginx показывает сертификат Let's Encrypt → nginx выбирает Ingress по Host и SNI →
          Service → под. Соединений два, и сертификат кластера видит только Cloudflare.
      - q: Что происходит в TLS-рукопожатии?
        a: >-
          Клиент и сервер договариваются о шифрах и обмениваются ключевым материалом, из которого обе
          стороны выводят общий ключ сессии. Сервер показывает сертификат, клиент проверяет цепочку до
          доверенного CA и имя хоста, а сервер подписью доказывает, что владеет закрытым ключом. В TLS 1.3
          на это уходит один круг туда-обратно.
      - q: Flexible, Full, Full (strict) в Cloudflare — в чём разница?
        a: >-
          Flexible ходит до origin по HTTP — трафик открытым текстом, никогда так не делать. Full — HTTPS
          без проверки сертификата: подмену между Cloudflare и origin он не заметит. Strict проверяет
          цепочку и имя; включать его можно только после настоящих сертификатов на origin, иначе 526.
      - q: HTTP-01 или DNS-01?
        a: >-
          HTTP-01 требует, чтобы Let's Encrypt достучался до ingress по 80, и не умеет wildcard. DNS-01
          работает, даже когда вход закрыт (у нас 80/443 пускают только Cloudflare), и умеет `*.домен`, но
          нужен API-токен к DNS — его права режут одной зоной. Все сертификаты выпустились ещё до появления
          A-записей.
      - q: Сертификат от cert-manager не выпускается. Где смотришь?
        a: >-
          По цепочке `Certificate` → `CertificateRequest` → `Order` → `Challenge`: у каждого события и
          статус. Обычно застревает на Challenge: для DNS-01 — нет прав у токена или запись не видна
          снаружи. Отлаживать — на staging-издателе: боевой Let's Encrypt после пяти неудач блокирует выпуск
          на час.
      - q: Пользователь видит 52x от Cloudflare. Где проблема?
        a: >-
          Код говорит, на каком шаге: 521 — origin не отвечает (ingress лёг или нода погашена), 522 —
          соединение не установилось (firewall, устаревшие адреса Cloudflare), 525 — не прошло
          TLS-рукопожатие, 526 — в strict сертификат origin не прошёл проверку. Дальше — логи ingress: нет
          там запроса — проблема между Cloudflare и кластером.
      - q: Зачем закрывать origin для всех, кроме Cloudflare?
        a: >-
          Иначе всю защиту обходит один запрос на адрес ноды с нужным `Host`: мимо защиты от DDoS, WAF и
          Access к админкам. Firewall на 80/443 пускает только сети Cloudflare. Проверка — `curl` прямо на
          адрес: соединение не устанавливается.
      - q: Как ingress за прокси узнаёт настоящий IP клиента и где подвох?
        a: >-
          Cloudflare кладёт его в `CF-Connecting-IP`, nginx берёт адрес оттуда. Подвох — доверять заголовку
          можно только от сетей прокси (`proxy-real-ip-cidr`): иначе любой подставит себе чужой IP, обойдёт
          allow-листы и запутает логи.
      - q: Как вход в кластер сделан без облачного балансировщика? Минусы?
        a: >-
          ingress-nginx с `hostNetwork: true` прибит к одной ноде и слушает 80/443 прямо на её адресе.
          Минусы: одна нода — единая точка отказа, при её смерти входа нет вообще, масштабировать некуда. В
          проде — Service LoadBalancer, MetalLB на своём железе или внешний балансировщик на несколько нод.
    lab: ['02-platform — «ingress-nginx — вход снаружи», «cert-manager — сертификаты»', '10-cloudflare — целиком']
    gdoc: ['Kubernetes: M12', 'Сети: M9, M10, M11, M12']
    seen: [situations/site-down, runbooks/ingress, runbooks/certificates]
    drill: ['k8s: ingress', 'сети: tls, http, proxy-cdn, load-balancing']

  - id: 20
    practice: >-
      Нарисуй путь запроса из браузера: DNS, маршрут, локальный шлюз и TCP. Для каждого слоя
      назови, что наблюдаешь при сбое и какой следующий слой проверять после успеха.
    title: Сетевой фундамент
    area: Сеть
    status: todo
    brief: >-
      Под всеми сетями кластера — обычные IP, TCP и DNS. Пакет идёт по слоям: приложение отдаёт данные
      TCP, тот режет их на сегменты, IP решает, куда везти, а Ethernet доставляет до ближайшего
      маршрутизатора по MAC-адресу, который подсказал ARP. Маска говорит, кто в твоей подсети, а кто — через
      шлюз; NAT подменяет адреса на границе сети. DNS переводит имя в адрес и кэширует ответ на время TTL.
      Главный вопрос собеса здесь — «что происходит, когда вводишь адрес в браузере».
    steps: []
    read:
      - title: What happens when… — alex/what-happens-when
        url: https://github.com/alex/what-happens-when
        note: >-
          Классический вопрос собеса по шагам: клавиатура, DNS, ARP, TCP, TLS, HTTP. Хватит разделов про
          сеть — от DNS до HTTP.
        lang: en
        min: 20
    questions:
      - q: Что происходит, когда вводишь адрес в браузере?
        a: >-
          DNS: имя → IP (кэш браузера и ОС, потом резолвер). TCP: тройное рукопожатие с сервером на порт 443.
          TLS: проверка сертификата и общий ключ. HTTP: запрос и ответ, браузер рисует страницу и докачивает
          ресурсы. Под этим — маршрутизация по IP и ARP до ближайшего шлюза.
      - q: Что делает маска подсети и сколько адресов в /24 и /26?
        a: >-
          Маска говорит, какая часть адреса — сеть: если получатель в твоей сети, пакет идёт напрямую, иначе
          — на шлюз. /24 — 256 адресов (254 под хосты), /26 — 64 (62 под хосты): каждый бит маски делит
          сеть пополам.
      - q: Зачем нужен ARP?
        a: >-
          IP говорит, куда везти пакет, но в локальной сети кадр доставляется по MAC-адресу. ARP спрашивает
          всех «у кого этот IP?», хозяин отвечает своим MAC, ответ кэшируется. Для адреса за пределами
          подсети ищется MAC шлюза, а не самого получателя.
      - q: TCP или UDP — в чём разница?
        a: >-
          TCP устанавливает соединение тройным рукопожатием, гарантирует доставку и порядок, повторяет
          потерянное и регулирует скорость. UDP просто шлёт датаграммы без гарантий — быстрее и проще: DNS,
          VXLAN, видео, QUIC. Надёжность поверх UDP, если нужна, делает само приложение.
      - q: Что такое NAT и где он встречается в кластере?
        a: >-
          Подмена адресов на границе: SNAT меняет адрес источника (машины выходят в интернет через один
          адрес), DNAT — адрес назначения (проброс портов). На DNAT построен Service: kube-proxy подменяет
          ClusterIP на адрес пода, а conntrack помнит соединение, чтобы ответ вернулся обратно.
      - q: Как работает рекурсивное разрешение DNS и что такое TTL?
        a: >-
          Резолвер идёт от корня: корневые серверы знают серверы зоны `.com`, те — серверы домена, а
          авторитетный сервер домена отдаёт запись. Ответ кэшируется на TTL секунд, поэтому смена записи
          доезжает не сразу. A — адрес IPv4, AAAA — IPv6, CNAME — псевдоним, TXT — текст, на нём держится
          проверка DNS-01.
      - q: Чем маршрутизатор отличается от коммутатора?
        a: >-
          Коммутатор пересылает кадры внутри одной сети по MAC-адресам. Маршрутизатор соединяет разные сети
          и пересылает пакеты по IP, выбирая следующий хоп по таблице маршрутов: выигрывает самый длинный
          совпавший префикс, а если не совпало ничего — маршрут по умолчанию.
    lab: []
    gdoc: ['Сети: M1–M8, справочник часть 1, фазы 1–2']
    seen: []
    drill: ['сети: osi-model, ipv4-addressing, ethernet-arp, dhcp, routing, bgp-ospf, nat, tcp-udp, ipv6']

  - id: 21
    practice: >-
      Кто-то поменял firewall в консоли GCP. Объясни, что увидишь в `terraform plan`, как
      отличишь изменение намерения от случайного дрейфа и где проверишь разрешение на `apply`.
    title: 'Облако и Terraform: VPC, firewall, доступ без ключей'
    area: Облако
    status: todo
    brief: >-
      Инфраструктура лаба описана в Terraform: код говорит, что должно быть, `plan` показывает разницу с
      реальностью, `apply` её устраняет, а state помнит, какие реальные ресурсы чему соответствуют. State
      лежит в бакете с блокировкой, план смотрят глазами при каждом PR, apply — только вручную из `main`. CI
      ходит в GCP без ключа: короткий токен GitHub меняется на временные креды через Workload Identity
      Federation. В GCP сеть VPC глобальная, файрвол — на уровне сети по тегам машин, а входящее
      запрещено по умолчанию.
    steps: []
    read:
      - title: What is Terraform
        url: https://developer.hashicorp.com/terraform/intro
        note: >-
          Код, plan, apply и state — как Terraform узнаёт, что создать, поменять или удалить.
        lang: en
        min: 4
      - title: VPC networks — Google Cloud
        url: https://docs.cloud.google.com/vpc/docs/vpc
        note: >-
          VPC глобальная, подсети региональные, маршруты и файрвол на уровне сети. Хватит первой
          половины.
        lang: en
        min: 15
    questions:
      - q: Как Terraform понимает, что нужно поменять?
        a: >-
          Сравнивает код (что должно быть), state (что он создал и как это называется в облаке) и
          реальность, которую спрашивает у провайдера. `plan` показывает разницу, `apply` её устраняет. Без
          state он не знает, какие ресурсы его, поэтому state хранят в общем бакете с блокировкой.
      - q: Где хранится state и почему не локально?
        a: >-
          В бакете GCS со встроенной блокировкой: один state на человека и CI, два apply одновременно не
          пойдут. В state лежат все атрибуты ресурсов, бывают и секреты, поэтому доступ к бакету — как к
          секрету, плюс версионирование на случай порчи.
      - q: Как CI ходит в GCP без ключа?
        a: >-
          Workload Identity Federation: GitHub выдаёт джобе короткоживущий токен OIDC (какой репо, ветка,
          событие), Google проверяет подпись и условие провайдера и выдаёт временные креды сервисного
          аккаунта на час. Хранить нечего — нечего и украсть; JSON-ключ живёт вечно и утекает из логов.
      - q: Что будет, если не задать условие на провайдере WIF?
        a: >-
          Проверку подписи пройдёт токен любого репозитория на GitHub, и безопасность будет держаться
          только на привязке к сервисному аккаунту: одна ошибка там — и чужой репо получит твои креды.
          Поэтому условие `assertion.repository == "<репо>"` обязательно.
      - q: Почему apply не запускается сам после мержа?
        a: >-
          Инфраструктура меняется редко, а ошибка стоит нод вместе с etcd. План при PR смотрят глазами,
          apply — отдельный ручной запуск только из `main`. Для частых и безопасных изменений
          автоприменение оправдано, для этих ресурсов — нет.
      - q: Кто-то поменял ресурс руками в консоли. Что дальше?
        a: >-
          Следующий `plan` покажет расхождение, и `apply` вернёт как в коде. Если ручная правка была нужна —
          перенести её в код. У нас была такая грабля: адрес в `terraform.tfvars` и переменная CI должны
          меняться вместе, иначе CI откатит firewall на старый адрес и отрежет доступ к API.
      - q: Чем сеть GCP отличается от AWS?
        a: >-
          VPC в GCP глобальная, подсети — региональные, интернет-шлюз и маршрут по умолчанию появляются
          сами. Файрвол — правила на уровне сети с привязкой к машинам по тегам: входящее запрещено неявно,
          исходящее разрешено. SSH — через IAP без открытого всему миру 22-го порта, а MTU сети — 1460, а не
          1500.
      - q: Сменил тип VM в Terraform — не потеряются ли данные на ноде?
        a: >-
          Зависит от плана: `updated in-place` — та же машина с тем же диском, terraform сам остановит и
          запустит её. `must be replaced` — новая машина, и загрузочный диск с `auto_delete` уйдёт вместе со
          старой. Перед apply — drain, иначе для кластера это внезапный отказ ноды.
    lab: ['09-ci-terraform — целиком', 'CLAUDE.md лаба — «Чем GCP отличается от того, что было в AWS»']
    gdoc: ['Сети: M15, M16, M17, «Чекпоинт фазы 4»']
    seen: []
    drill: ['сети: vpn-tunnels, firewall, cloud-vpc', 'terraform: core-workflow, state, modules', 'gcp: iam, networking']

  - id: 22
    practice: >-
      На учебном примере объясни, какие задачи решают оператор Postgres, Cilium и service
      mesh. Для каждого назови объект или сигнал, по которому подтвердил бы работу.
    title: 'Расширения: операторы, eBPF, service mesh'
    area: Платформа
    status: todo
    brief: >-
      Kubernetes расширяется без правки его кода. CRD добавляет новый тип объекта, а оператор — контроллер,
      который знает, как с ним обращаться: например, CloudNativePG сам поднимает реплики Postgres и
      переключает primary. eBPF — маленькие программы прямо в ядре, без модулей: на нём Cilium строит сеть,
      политики и видимость трафика. Service mesh ставит рядом с каждым сервисом прокси и берёт на себя mTLS,
      повторы, таймауты и метрики между сервисами. В лабе уже работают prometheus-operator и
      cert-manager, Cilium стоит как CNI, а mesh нет — эта тема в основном на вырост.
    steps: []
    read:
      - title: Operator pattern
        url: https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
        note: >-
          Что такое оператор: свой ресурс плюс контроллер, который знает, как с ним обращаться.
        lang: en
        min: 6
      - title: What is eBPF?
        url: https://ebpf.io/what-is-ebpf/
        note: >-
          Программы в ядре без модулей — на этом построены Cilium и Hubble. Хватит начала, до разделов про
          инструменты разработки.
        lang: en
        min: 10
      - title: What's a service mesh? And why do I need one? — William Morgan
        url: https://www.cncf.io/blog/2017/04/26/service-mesh-critical-component-cloud-native-stack/
        note: >-
          Классическое объяснение от автора Linkerd: что mesh берёт на себя и когда он нужен.
        lang: en
        min: 12
    questions:
      - q: Что такое оператор и чем он лучше Helm-чарта?
        a: >-
          CRD — новый тип объекта в API, оператор — контроллер, который следит за такими объектами и
          доводит кластер до описанного состояния. Helm ставит манифесты один раз, а оператор живёт рядом и
          умеет «второй день»: переключить primary базы, сделать бэкап, обновить версию. В лабе так работают
          prometheus-operator с ServiceMonitor и cert-manager с Certificate.
      - q: Как устроен цикл контроллера — reconcile loop?
        a: >-
          Контроллер подписан на свои объекты через watch и в цикле сравнивает желаемое (`spec`) с
          фактическим: делает шаг к желаемому и пишет итог в `status`. Цикл должен быть идемпотентным: его
          повторяют при каждом изменении и периодически, и повтор не должен ломать уже сделанное.
      - q: Что такое eBPF и что он даёт Cilium?
        a: >-
          Маленькие проверенные программы, которые ядро запускает на своих событиях — приход пакета,
          системный вызов — без модулей и перезагрузки. Cilium на нём делает сеть подов, NetworkPolicy и
          балансировку Service без длинных цепочек iptables, а Hubble показывает каждый поток и дроп с
          причиной.
      - q: Что такое service mesh и когда он нужен?
        a: >-
          Прокси рядом с каждым сервисом плюс управляющая часть, которая их настраивает. Mesh берёт на себя
          mTLS между сервисами, повторы, таймауты, балансировку по запросам и метрики, не трогая код. Нужен,
          когда сервисов много и всё это иначе пришлось бы писать в каждом; для пары сервисов — лишняя
          сложность.
      - q: Чем mesh с sidecar отличается от mesh без sidecar?
        a: >-
          Sidecar — свой прокси в каждом поде: полный контроль, но память на каждый под и сложности с
          порядком запуска. Без sidecar (ambient) — общий агент на ноде для mTLS и L4 плюс отдельные L7-прокси
          только там, где они нужны: дешевле, но меньше изоляции между подами.
      - q: Зачем таймауты, повторы и circuit breaker между сервисами?
        a: >-
          Таймаут на каждый вызов — меньше, чем у вызывающего, иначе ожидания копятся по цепочке. Повторы —
          только идемпотентных операций, с паузой и лимитом, иначе они умножают нагрузку на больной сервис.
          Circuit breaker перестаёт звать то, что лежит, и даёт ему подняться.
      - q: Как оператор базы переключает primary при отказе?
        a: >-
          Он следит за подами кластера базы. Пропал primary — выбирает самую свежую реплику, продвигает её в
          primary и переключает на неё Service для записи. Клиенты ходят через Service, поэтому адрес для них
          не меняется. Руками это будет в блоке 4, на CloudNativePG.
