    drill: ['k8s: observability']

  - id: 4
    title: Алерты и дежурство
    area: Наблюдаемость
    status: todo
    brief: >-
      Prometheus решает, что сломалось, а Alertmanager — кому, когда и как об этом сказать: склеивает
      похожие алерты в одно сообщение, глушит лишнее и шлёт в Telegram с разной срочностью. Хороший алерт
      — про симптом, который видит пользователь (ошибки, задержка), а не про «CPU 80%». Каждое своё
      правило проверено юнит-тестом, а в каждом сообщении есть ссылка на runbook — что делать в три
      часа ночи. О смерти самого мониторинга сообщает внешний сторож: тишина в чате не значит «всё
      хорошо».
    steps: [2-2, 2-3, 2-4]
    read:
      - title: Alertmanager
        url: https://prometheus.io/docs/alerting/latest/alertmanager/
        note: >-
          Группировка, inhibition, silence и маршруты — четыре инструмента против шума.
        lang: en
        min: 4
      - title: Monitoring Distributed Systems — Google SRE Book, глава 6
        url: https://sre.google/sre-book/monitoring-distributed-systems/
        note: >-
          Почему алертить на симптомы, а не на причины, и четыре золотых сигнала: задержка, трафик,
          ошибки, насыщение. Главное — разделы про симптомы и причины и про золотые сигналы.
        lang: en
        min: 15
    questions:
      - q: Что делает Alertmanager, если Prometheus уже решил, что сломалось?
        a: >-
          Решает, кому, когда и как сказать. Группирует похожие алерты в одно сообщение, разводит их по
          срочности (critical — со звуком и напоминанием каждые 2 часа), глушит лишнее через inhibit и
          silence. Сам ничего не вычисляет — только доставляет.
      - q: group_wait, group_interval, repeat_interval — что каждый делает?
        a: >-
          `group_wait` — сколько ждать после первого алерта группы, чтобы собрать соседей в одно
          сообщение (у нас 30 с). `group_interval` — как часто слать, если в группе появилось новое
          (5 мин). `repeat_interval` — когда напомнить, если ничего не поменялось: critical — 2 ч,
          warning — 12 ч.
      - q: Как убирать шум — silence, inhibit, отключить правило или маршрут?
        a: >-
          Silence — временно: на работы или до починки известной проблемы, со сроком и комментарием.
          Inhibit — когда один алерт объясняет другие: нода упала — не слать про каждый её под.
          Отключить правило — если оно неверно для твоей схемы, и написать своё. Маршрут — алерт верный,
          но не срочный: в тихий канал.
      - q: Зачем внешний сторож, если есть Alertmanager?
        a: >-
          Если умрёт Alertmanager, его нода или весь кластер, сообщить будет некому, а тишина выглядит
          как «всё хорошо». Watchdog горит всегда и раз в минуту уходит во внешний сервис; пропали пинги
          на 5 минут — тот пишет в Telegram своим ботом. На плановое гашение лаба сторож ставится на
          паузу.
      - q: Почему алерт на симптомы лучше, чем «CPU 80%»?
        a: >-
          Пользователю всё равно, насколько занят процессор: ему важно, отвечает ли сайт и как быстро.
          Поэтому алертим на долю 5xx и p99 через ingress. Подвох: при маленьком трафике одна ошибка —
          это десятки процентов, нужен порог по трафику, а без трафика такой алерт молчит — нужны
          проверки снаружи.
      - q: Как проверяешь, что алерт сработает, до того как он понадобится?
        a: >-
          Юнит-тестами `promtool test rules`: подаю выдуманные ряды и жду конкретный алерт с нужными
          метками — и обратный случай, где он молчит. Тесты гоняет CI на каждый push. И один раз ломаю
          правило руками: тест, который ни разу не падал, ничего не доказывает.
      - q: Зачем в правиле `for` и чем за него платишь?
        a: >-
          Чтобы не будить из-за того, что было плохо пару минут: рестарт, выкатка, перевыборы лидера.
          У нас после подъёма лаба цели первые минуты не видны, и `for: 15m` отсекает ложные `*Down`.
          Цена — о настоящей поломке тоже узнаешь на 15 минут позже.
      - q: Зачем runbook, если есть алерт?
        a: >-
          Алерт будит, runbook говорит, что делать, пока не проснулся до конца: чем грозит, что
          проверить, как починить, когда звать на помощь. Ссылка — прямо в сообщении и открывается с
          телефона. У готовых правил каждая четвёртая ссылка вела на 404, поэтому runbook'и свои.
    lab: ['03-observability — «Alertmanager → Telegram», «Свои правила алертов», «Runbook''и»']
    gdoc: ['Kubernetes: M20']
    seen: [runbooks/triage, runbooks/inotify]
    drill: ['k8s: observability']

