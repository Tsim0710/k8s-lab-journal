# Маршрут k8s-лаба — единственный источник плана и статусов.
# Страница https://tsim0710.github.io/k8s-lab-journal/ собирается из этого файла.
# status: done | now | todo. Сделанному шагу — done: <дата> и journal: <дата записи>.
# today — что на сегодня; steps — id шагов из blocks.

trial_end: '2026-12-27'
today:
  date: '2026-10-19'
  focus: 'Закрыть блок 1 наполовину: восстановление etcd из снимка, потом подготовка к апгрейду'
  steps:
  - 1-3
  - 1-4
  note: >-
    Утро: etcd изнутри и шифрование — сделано. Дальше: снимок и восстановление (3–4 ч). Если хватит фокуса
    — kubeadm upgrade plan и release notes 1.37, сам апгрейд можно завтра. В конце — конспект, push, lab-down.
blocks:
- id: b1
  title: Опасная эксплуатация кластера
  days: 2–3 дня
  target: до 22.10
  why: >-
    То, что на проде делать страшно: восстановить кластер из бэкапа и обновить его без простоя. Сначала
    — пока на кластере мало навешано, и снимок etcd страхует всё, что сломаем дальше.
  done_when: >-
    Восстановление из снимка отрепетировано, кластер на 1.37, ежедневная работа — под своим kubeconfig
    без cluster-admin.
  steps:
  - id: 1-1
    title: 'etcd изнутри: флаги, доступ, MVCC, watch, файлы'
    hours: 4
    status: done
    done: '2026-10-19'
    journal: '2026-10-19'
    note: docs/01-cluster.md
  - id: 1-2
    title: Шифрование секретов в etcd и ротация ключа
    hours: 4
    status: done
    done: '2026-10-19'
    journal: '2026-10-19'
    note: docs/13-security.md; заодно инцидент с argocd-secret
  - id: 1-3
    title: Снимок etcd и восстановление вместе с ключом
    hours: 4
    status: now
    note: >-
      снимок → удалить ns demo → restore в новый каталог; без ключа секреты нечитаемы; проверить, что
      открытый пароль ушёл из WAL; make etcd-backup
  - id: 1-4
    title: kubeadm upgrade 1.36 → 1.37
    hours: 5
    status: todo
    note: >-
      upgrade plan, release notes, cp, воркеры по одному с drain; после — шифрование и метрики на месте
  - id: 1-5
    title: drain, PDB и отказ ноды
    hours: 3
    status: todo
    note: погасить w2 и засечь, когда поды уедут; что с StatefulSet и PVC на local-path
  - id: 1-6
    title: 'RBAC: свой пользователь вместо admin.conf'
    hours: 2
    status: todo
    note: edit на нужные ns, --as для проверки, ServiceAccount с минимумом прав
